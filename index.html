function blockMinOptions(sel){ let o=''; for(let m=0;m<60;m+=5) o+=`<option value="${m}" ${+sel===m?'selected':''}>${pad2(m)}</option>`; return o; }
function blockDurHOptions(sel){ let o=''; for(let h=0;h<=8;h++) o+=`<option value="${h}" ${+sel===h?'selected':''}>${h}h</option>`; return o; }
function blockDurMOptions(sel){ let o=''; for(let m=0;m<60;m+=5) o+=`<option value="${m}" ${+sel===m?'selected':''}>${m}m</option>`; return o; }
let _blk=null;
function openBlockModal(opts){
  opts=opts||{};
  const editing=!!opts.id;
  const t=editing?taskById(opts.id):null;
  if(editing && !t) return;
  const startMin= t&&t.startTime? timeToMin(t.startTime) : (opts.startTime? timeToMin(opts.startTime) : 9*60);
  const mm5=Math.round((startMin%60)/5)*5%60;
  const dur=t?(t.duration||60):(opts.duration||30);
  _blk={
    id: editing? t.id : null,
    title: t? t.title : '',
    categoryId: t? (t.categoryId||'') : (opts.categoryId||''),
    date: t? (t.date||todayStr()) : (opts.date||todayStr()),
    hh: Math.floor(startMin/60), mm: mm5,
    durh: Math.floor(dur/60), durm: dur%60,
    reminder: t&&t.reminder!==undefined? t.reminder : 0,
    repeatOn: !!(t&&t.repeat),
    repeatDays: (t&&t.repeat&&Array.isArray(t.repeat.days))? t.repeat.days.slice() : []
  };
  renderBlockModal();
}
function renderBlockModal(){
  const s=_blk, box=document.getElementById('modalbox'), overlay=document.getElementById('overlay');
  const editing=!!s.id;
  overlay.classList.add('show'); box.classList.add('show'); box.classList.add('blk'); box.classList.remove('pe');
  box.innerHTML=`
    <h3 class="pe-title">${editing?'블록 수정':'블록 추가'}</h3>
    <div class="pe-scroll">
      <div class="field"><label>이름</label><input type="text" id="blk_title" placeholder="할 일 / 일정 이름" value="${esc(s.title)}"></div>
      <div class="field"><label>카테고리 <span class="blk-catedit" id="blk_catedit">편집</span></label>
        <div class="catpick" id="blk_catpick">${blockCatChipsHTML(s.categoryId)}</div>
      </div>
      <div class="field"><label>📅 날짜</label><input type="date" id="blk_date" value="${s.date}"></div>
      <div class="field row2">
        <div><label>⏰ 시작</label><div class="blk-timesel"><select id="blk_hh">${blockHourOptions(s.hh)}</select><span>:</span><select id="blk_mm">${blockMinOptions(s.mm)}</select></div></div>
        <div><label>⏱ 소요</label><div class="blk-timesel"><select id="blk_durh">${blockDurHOptions(s.durh)}</select><select id="blk_durm">${blockDurMOptions(s.durm)}</select></div></div>
      </div>
      <div class="field"><label>🔔 이 블록 알림</label>
        <div class="blk-remrow" id="blk_remrow">${BLK_REM_OPTS.map(([v,l])=>`<button type="button" class="blk-rem ${String(s.reminder)===String(v)?'on':''}" data-v="${v}">${l}</button>`).join('')}</div>
      </div>
      <div class="togglerow"><span class="lab">반복 안함</span><div class="switch ${s.repeatOn?'on':''}" id="blk_repeatSwitch"><i></i></div></div>
      <div id="blk_repeatWrap" style="display:${s.repeatOn?'block':'none'};margin:8px 0 4px;">
        <div class="wdaychips" id="blk_repeatDays">${['월','화','수','목','금','토','일'].map((d,i)=>`<div class="w ${s.repeatDays.includes(i)?'sel':''}" data-i="${i}">${d}</div>`).join('')}</div>
      </div>
    </div>
    <div class="modalfooter">${editing?'<button type="button" class="pe-del" id="blk_del">🗑️ 삭제</button>':''}<button type="button" class="ok" id="blk_save">저장</button></div>
  `;
  box.querySelector('#blk_title').addEventListener('input',e=>{ s.title=e.target.value; });
  box.querySelector('#blk_date').addEventListener('change',e=>{ s.date=e.target.value||s.date; });
  box.querySelector('#blk_hh').addEventListener('change',e=>{ s.hh=+e.target.value; });
  box.querySelector('#blk_mm').addEventListener('change',e=>{ s.mm=+e.target.value; });
  box.querySelector('#blk_durh').addEventListener('change',e=>{ s.durh=+e.target.value; });
  box.querySelector('#blk_durm').addEventListener('change',e=>{ s.durm=+e.target.value; });
  box.querySelectorAll('#blk_catpick .cchip').forEach(chip=>chip.onclick=()=>{
    s.categoryId=chip.dataset.cat;
    box.querySelectorAll('#blk_catpick .cchip').forEach(x=>{
      const on=x===chip;
      const cid=x.dataset.cat, c=cid?cat(cid):{color:'var(--line-strong)',name:'없음'};
      x.classList.toggle('sel',on);
      x.style.cssText=on?`background:${c.color};border-color:${c.color};color:#fff`:`border-color:${c.color}`;
    });
  });
  box.querySelector('#blk_catedit').onclick=()=>{ closeModal(); _blk=null; openCategoryManager(); };
  box.querySelectorAll('.blk-rem').forEach(b=>b.onclick=()=>{
    s.reminder=b.dataset.v==='off'?'off':+b.dataset.v;
    box.querySelectorAll('.blk-rem').forEach(x=>x.classList.toggle('on',x===b));
  });
  box.querySelector('#blk_repeatSwitch').onclick=(e)=>{
    s.repeatOn=!s.repeatOn;
    e.currentTarget.classList.toggle('on',s.repeatOn);
    box.querySelector('#blk_repeatWrap').style.display=s.repeatOn?'block':'none';
  };
  box.querySelectorAll('#blk_repeatDays .w').forEach(w=>w.onclick=()=>{
    const i=+w.dataset.i; const idx=s.repeatDays.indexOf(i);
    if(idx>=0) s.repeatDays.splice(idx,1); else s.repeatDays.push(i);
    w.classList.toggle('sel');
  });
  const del=box.querySelector('#blk_del');
  if(del) del.onclick=()=>{
    const t0=taskById(s.id);
    if(t0 && isRepeatSeries(t0)){
      askDeleteScope('반복되는 일정이에요. 어떻게 삭제할까요?',
        ()=>{ state.tasks=state.tasks.filter(x=>x.id!==s.id); _blk=null; render(); },
        ()=>{
          const anchorId=repeatAnchorId(t0), fromDate=t0.date;
          stopRepeatFrom(anchorId,fromDate);
          state.tasks=state.tasks.filter(x=>!((x.id===anchorId||x.repeatParentId===anchorId) && x.date>=fromDate));
          _blk=null; render();
        }
      );
    } else {
      askConfirm('이 블록을 삭제할까요?',()=>{
        state.tasks=state.tasks.filter(x=>x.id!==s.id);
        _blk=null; closeModal(); render();
      });
    }
  };
  box.querySelector('#blk_save').onclick=()=>{
    const title=(box.querySelector('#blk_title').value||'').trim()||'새 일정';
    const date=box.querySelector('#blk_date').value||todayStr();
    const startTime=`${pad2(s.hh)}:${pad2(s.mm)}`;
    const duration=Math.max(5,s.durh*60+s.durm);
    const reminder=s.reminder;
    let repeat=null;
    if(s.repeatOn && s.repeatDays.length) repeat={days:s.repeatDays.slice(),mode:'continue',until:'',monthDates:[],yearly:''};
    let titleChangedSeries=null;
    if(s.id){
      const t=taskById(s.id);
      const oldTitle=t.title;
      t.title=title; t.categoryId=s.categoryId||null; t.date=date; t.startTime=startTime; t.duration=duration; t.reminder=reminder; t.repeat=repeat;
      if(repeat) generateRepeatInstances(t);
      if(oldTitle!==title && isRepeatSeries(t)){
        const anchorId=repeatAnchorId(t);
        const hasFuture=state.tasks.some(x=>(x.id===anchorId||x.repeatParentId===anchorId)&&x.id!==t.id);
        if(hasFuture) titleChangedSeries={anchorId,newTitle:title,exceptId:t.id};
      }
    } else {
      const nt=addTopTask(title,{categoryId:s.categoryId||null,date,startTime,duration,reminder,repeat});
      if(repeat) generateRepeatInstances(nt);
    }
    _blk=null; closeModal(); render();
    if(titleChangedSeries){
      const {anchorId,newTitle,exceptId}=titleChangedSeries;
      askConfirm('제목을 앞으로의 반복 일정에도 똑같이 적용할까요?',()=>{
        state.tasks.forEach(x=>{ if((x.id===anchorId||x.repeatParentId===anchorId) && x.id!==exceptId) x.title=newTitle; });
        render();
      });
    }
  };
}
function openExecLogModal(id,idx){
  const t=taskById(id);
  const l=t&&t.executionLogs[idx];
  if(!l) return;
  let sel=t.categoryId;
  openModal('기록 수정',`
    <div class="field"><label>제목</label><input type="text" id="l_title" value="${esc(t.title)}"></div>
    <div class="field"><label>시간</label>
      <div class="row2"><div><input type="time" id="l_start" value="${l.start}"></div><div><input type="time" id="l_end" value="${l.end}"></div></div>
    </div>
    <div class="field"><label>카테고리</label><div class="catpick">
      ${state.categories.map(c=>`<div class="cchip ${sel===c.id?'sel':''}" data-cat="${c.id}" style="${sel===c.id?`background:${c.color};border-color:${c.color};color:#fff`:''}">${c.name}</div>`).join('')}
    </div></div>
    <div id="l_err" style="color:var(--danger);font-size:12px;margin-bottom:8px;display:none">끝나는 시간이 시작 시간보다 뒤여야 해요.</div>
    <button type="button" class="smallbtn danger" id="l_del">이 기록 삭제</button>
  `,(box)=>{
    const st=box.querySelector('#l_start').value, en=box.querySelector('#l_end').value;
    if(!st||!en||timeToMin(en)<=timeToMin(st)){ box.querySelector('#l_err').style.display='block'; return false; }
    l.start=st; l.end=en;
    t.title=box.querySelector('#l_title').value.trim()||t.title;
    t.categoryId=sel;
    render();
  });
  document.querySelectorAll('#modalBody .cchip').forEach(chip=>{
    chip.onclick=()=>{
      sel=chip.dataset.cat;
      document.querySelectorAll('#modalBody .cchip').forEach(x=>{x.classList.remove('sel');x.style.cssText='';});
      const c=cat(sel); chip.classList.add('sel'); chip.style.cssText=`background:${c.color};border-color:${c.color};color:#fff`;
    };
  });
  document.getElementById('l_del').onclick=()=>{ t.executionLogs.splice(idx,1); closeModal(); render(); };
}

function openRepeatModal(id){
  const t=taskById(id);
  const r=t.repeat||{};
  const days=r.days||[];
  const monthDates=r.monthDates||[];
  const mode=r.mode||'until';
  const interval=r.interval||1;
  const dow=['월','화','수','목','금','토','일'];
  const subSummary=m=>m==='continue'?'계속 반복':'끝날 때까지 반복';
  const dueSummary=u=>u?`${u.slice(5).replace('-','/')}까지`:'없음';
  const bydateSummary=arr=>arr.length?`${arr.length}일`:'안 씀';
  const yearlySummary=y=>y?y:'안 씀';
  openModal('🔁 반복',`
    <div class="rp-hint">🍓 어느 요일에 반복할까요?</div>
    <div class="wdaychips" id="r_days">
      ${dow.map((d,i)=>`<div class="w ${days.includes(i)?'sel':''}" data-i="${i}">${d}</div>`).join('')}
    </div>
    <div class="rp-quickrow">
      <span class="smallbtn" data-quick="daily">매일</span>
      <span class="smallbtn" data-quick="weekday">평일</span>
      <span class="smallbtn" data-quick="weekend">주말</span>
      <span class="smallbtn" data-quick="clear">해제</span>
    </div>

    <div class="rp-divider"></div>
    <div class="rp-steprow">
      <span class="lab">몇 주마다</span>
      <div class="rp-stepper">
        <button type="button" class="step" id="r_intMinus">−</button>
        <span id="r_intLabel">${interval===1?'매주':interval+'주마다'}</span>
        <button type="button" class="step" id="r_intPlus">+</button>
      </div>
    </div>

    <div class="rp-divider"></div>
    <div class="rp-arow" data-panel="sub">
      <span class="lab">하위 할 일</span>
      <span class="val"><span id="rp_sub_summary">${subSummary(mode)}</span> ›</span>
    </div>
    <div class="rp-panel" id="rp_panel_sub">
      <div class="rp-modecard ${mode==='until'?'sel':''}" id="r_mode_until" data-mode="until">
        <div class="rp-modehead">✅ 끝날 때까지 반복</div>
        <div class="rp-modedesc">체크한 요일에 계속 보이다가, 완료하면 끝</div>
      </div>
      <div class="rp-modecard ${mode==='continue'?'sel':''}" id="r_mode_continue" data-mode="continue">
        <div class="rp-modehead">🔁 계속 반복</div>
        <div class="rp-modedesc">체크한 요일에 계속 보여 (다음날 다시 ○)</div>
      </div>
    </div>

    <div class="rp-arow" data-panel="due">
      <span class="lab">마감일</span>
      <span class="val"><span id="rp_due_summary">${dueSummary(r.until)}</span> ›</span>
    </div>
    <div class="rp-panel" id="rp_panel_due">
      <div class="field"><label>📅 마감일</label><input type="date" id="r_until" value="${r.until||''}"></div>
      <div class="rp-hint">오늘부터 1년 이내까지. 비우면 무기한 반복해요.</div>
    </div>

    <div class="rp-arow" data-panel="bydate">
      <span class="lab">날짜로 반복</span>
      <span class="val"><span id="rp_bydate_summary">${bydateSummary(monthDates)}</span> ›</span>
    </div>
    <div class="rp-panel" id="rp_panel_bydate">
      <div class="rp-hint">월급날 · 생일처럼 매월 특정 날짜에</div>
      <div class="rp-monthgrid" id="r_monthdates">
        ${Array.from({length:31},(_,i)=>i+1).map(n=>`<div class="d ${monthDates.includes(n)?'sel':''}" data-n="${n}">${n}</div>`).join('')}
      </div>
      <div class="rp-hint">그 달에 없는 날(29~31)이면 말일에 떠요.</div>
    </div>

    <div class="rp-arow" data-panel="yearly">
      <span class="lab">매년</span>
      <span class="val"><span id="rp_yearly_summary">${yearlySummary(r.yearly)}</span> ›</span>
    </div>
    <div class="rp-panel" id="rp_panel_yearly">
      <div class="field"><label>매년 (MM-DD)</label><input type="text" id="r_yearly" placeholder="예: 03-14" value="${esc(r.yearly||'')}"></div>
    </div>
  `,(box)=>{
    const sel=[...box.querySelectorAll('#r_days .w.sel')].map(x=>+x.dataset.i);
    const mSel=[...box.querySelectorAll('#r_monthdates .d.sel')].map(x=>+x.dataset.n);
    const until=box.querySelector('#r_until').value;
    const yearly=box.querySelector('#r_yearly').value.trim();
    const chosenMode=box.querySelector('.rp-modecard.sel')?.dataset.mode||'until';
    const chosenInterval=+box.querySelector('#r_intLabel').dataset.v||1;
    let needFollowup=false;
    if(sel.length||mSel.length||yearly){
      const patternChanged =
        JSON.stringify(sel.slice().sort())!==JSON.stringify((days||[]).slice().sort()) ||
        JSON.stringify(mSel.slice().sort((a,b)=>a-b))!==JSON.stringify((monthDates||[]).slice().sort((a,b)=>a-b)) ||
        yearly!==(r.yearly||'');
      t.repeat={days:sel,mode:chosenMode,until,monthDates:mSel,yearly,interval:chosenInterval};
      t.autoCarryOver=false;
      if(patternChanged && state.tasks.some(x=>x.repeatParentId===t.id)){
        needFollowup=true;
        render();
        askConfirm('반복 설정이 바뀌었어요. 이미 만들어둔 앞으로의 반복 일정도 새 설정에 맞게 다시 만들까요?',()=>{
          regenerateSeriesForNewDays(t); render();
        });
      } else {
        generateRepeatInstances(t);
      }
    } else {
      t.repeat=null;
    }
    if(!needFollowup) render();
    return needFollowup?false:undefined;
  });
  document.getElementById('r_intLabel').dataset.v=interval;
  document.getElementById('r_days').querySelectorAll('.w').forEach(w=>w.onclick=()=>w.classList.toggle('sel'));
  document.getElementById('r_monthdates').querySelectorAll('.d').forEach(d=>{
    d.onclick=()=>{
      d.classList.toggle('sel');
      const n=document.querySelectorAll('#r_monthdates .d.sel').length;
      document.getElementById('rp_bydate_summary').textContent=n?`${n}일`:'안 씀';
    };
  });
  document.querySelectorAll('.rp-modecard').forEach(card=>card.onclick=()=>{
    document.querySelectorAll('.rp-modecard').forEach(x=>x.classList.remove('sel'));
    card.classList.add('sel');
    document.getElementById('rp_sub_summary').textContent=subSummary(card.dataset.mode);
  });
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{
    const all=document.querySelectorAll('#r_days .w');
    const q=b.dataset.quick;
    if(q==='daily') all.forEach(w=>w.classList.add('sel'));
    else if(q==='weekday') all.forEach((w,i)=>{ i<5? w.classList.add('sel'): w.classList.remove('sel'); });
    else if(q==='weekend') all.forEach((w,i)=>{ i>=5? w.classList.add('sel'): w.classList.remove('sel'); });
    else if(q==='clear') all.forEach(w=>w.classList.remove('sel'));
  });
  const intLabel=document.getElementById('r_intLabel');
  const setInterval2=v=>{
    v=Math.max(1,Math.min(12,v));
    intLabel.dataset.v=v;
    intLabel.textContent=v===1?'매주':v+'주마다';
  };
  document.getElementById('r_intMinus').onclick=()=>setInterval2((+intLabel.dataset.v)-1);
  document.getElementById('r_intPlus').onclick=()=>setInterval2((+intLabel.dataset.v)+1);
  document.getElementById('r_until').addEventListener('input',e=>{
    document.getElementById('rp_due_summary').textContent=dueSummary(e.target.value);
  });
  document.getElementById('r_yearly').addEventListener('input',e=>{
    document.getElementById('rp_yearly_summary').textContent=yearlySummary(e.target.value.trim());
  });
  document.querySelectorAll('.rp-arow').forEach(row=>{
    row.onclick=()=>{
      const panel=document.getElementById('rp_panel_'+row.dataset.panel);
      const isOpen=panel.classList.contains('open');
      document.querySelectorAll('.rp-panel').forEach(p=>p.classList.remove('open'));
      document.querySelectorAll('.rp-arow').forEach(r2=>r2.classList.remove('open'));
      if(!isOpen){ panel.classList.add('open'); row.classList.add('open'); }
    };
  });
}

/* ============== 카테고리 관리 모달 ============== */
let catmgrOpenPaletteId=null;
let catDrag=null;

  closePopovers();

  wrap.className='catmgr-overlay';
  wrap.id='catmgrOverlay';
  wrap.innerHTML=`
    <div class="catmgr-card">
      <div class="catmgr-tagwrap"><div class="catmgr-tag">CATEGORIES</div></div>
      <h2>나의 분류들</h2>
      <div class="catmgr-list" id="catmgrList"></div>
      <div class="catmgr-addrow">
        <span class="catmgr-dot" style="background:${PALETTE[state.categories.length%PALETTE.length]}"></span>
        <input type="text" id="catmgrNewInput" placeholder="새 분류 적기...">
        <span class="catmgr-add" data-act="cat-add-mgr">+ 추가</span>

      <button class="catmgr-done" data-act="catmgr-close">완료</button>

function closeCategoryManager(){
  catmgrOpenPaletteId=null;
  const w=document.getElementById('catmgrOverlay');
  if(w) w.remove();
}
function doAddCategoryMgr(){
  const inp=document.getElementById('catmgrNewInput');
  if(inp && inp.value.trim()){
    state.categories.push({id:uid(),name:inp.value.trim(),color:RAINBOW15[state.categories.length%RAINBOW15.length],order:state.categories.length,visible:true});
    inp.value='';
    saveCategories();
    renderCatmgrList();
  }
}
function renderCatmgrList(){
  const list=document.getElementById('catmgrList');
  if(!list)return;
  list.innerHTML=state.categories.map((c,idx)=>`
    <div class="catmgr-row" data-id="${c.id}">
      <span class="catmgr-handle" data-drag="${c.id}">⠿</span>

      </div>

document.addEventListener('pointerup',(e)=>{

  const rowH=rows[0].getBoundingClientRect().height + 6;
  const delta=e.clientY-catDrag.startY;
  const shift=Math.round(delta/rowH);
  let newIndex=Math.max(0,Math.min(state.categories.length-1,catDrag.startIndex+shift));
  if(newIndex!==catDrag.startIndex){
    const [moved]=state.categories.splice(catDrag.startIndex,1);
    state.categories.splice(newIndex,0,moved);

/* ============== WORK (프로젝트 · 작업) ============== */
const WORK_KEY='plannerWorkV1';
const WORK_CFG_DEFAULT={weekStartsMonday:true,days:[true,true,true,true,true,true,true],fontScale:100,linkDaily:false,linkWeekly:false,
  timeAuto:true,timeStart:6,timeEnd:24,rowAuto:true,rowH:56,weeks:2,cellH:38};
function normalizeWork(w){
  const cfg=Object.assign({},WORK_CFG_DEFAULT,(w&&w.cfg)||{});
  cfg.days=(Array.isArray(cfg.days)&&cfg.days.length===7)?cfg.days.slice():WORK_CFG_DEFAULT.days.slice();
  if(!cfg.days.some(Boolean)) cfg.days=WORK_CFG_DEFAULT.days.slice();
  cfg.weeks=Math.min(4,Math.max(1,+cfg.weeks||2));
  return {projects:w.projects,tasks:w.tasks||[],memos:w.memos||[],cfg};
}
function newWorkDefault(){
  return normalizeWork({projects:[{id:uid(),name:'상시',color:'#C9AFEA',start:null,end:null,always:true,order:0}],tasks:[],memos:[]});
}
state.work=newWorkDefault();
function saveWork(){ try{ localStorage.setItem(WORK_KEY, JSON.stringify(state.work)); }catch(e){} }
function loadWork(){
  try{
    const raw=localStorage.getItem(WORK_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p && Array.isArray(p.projects) && p.projects.length) state.work=normalizeWork(p);
    }
  }catch(e){}
}
loadWork();
if(!state.settings._linkDailyMigratedV1){
  state.work.cfg.linkDaily=true;
  state.settings._linkDailyMigratedV1=true;
  saveWork(); saveSettings();
}

function wkCfg(){ return state.work.cfg; }
function wkProject(id){ return state.work.projects.find(p=>p.id===id); }
function wkTask(id){ return state.work.tasks.find(t=>t.id===id); }
function wkDefaultProject(){ return state.work.projects.find(p=>p.always)||state.work.projects[0]; }
function wkTasksOn(ds){ return state.work.tasks.filter(t=>t.date===ds).sort((a,b)=>(a.order||0)-(b.order||0)); }
function wkWeekStart(){
  if(!state.ui.workStart) state.ui.workStart=dstr(startOfWeek(new Date(),wkCfg().weekStartsMonday));
  return parseYMD(state.ui.workStart);
}
function wkAddTask(title,extra){
  const v=(title||'').trim(); if(!v) return null;
  const t={id:uid(),projectId:null,title:v,date:state.ui.workDate,done:false,doneAt:null,startTime:null,duration:60,order:state.work.tasks.length};
  Object.assign(t,extra||{});
  if(!wkProject(t.projectId)) t.projectId=wkDefaultProject().id;
  state.work.tasks.push(t);
  return t;
}
function wkFmtDur(m){
  m=+m||0; const h=Math.floor(m/60), r=m%60;
  return h?(r?`${h}시간 ${r}분`:`${h}시간`):`${r}분`;
}
const WK_DURS=[15,30,45,60,90,120,180,240];
function wkDurOptions(cur){
  const list=WK_DURS.includes(+cur)?WK_DURS:WK_DURS.concat([+cur]).sort((a,b)=>a-b);
  return list.map(m=>`<option value="${m}" ${+cur===m?'selected':''}>${wkFmtDur(m)}</option>`).join('');
}
function wkDday(p){
  if(!p.end) return '';
  const diff=Math.round((parseYMD(p.end)-parseYMD(todayStr()))/86400000);
  return diff===0?'D-day':diff>0?`D-${diff}`:`D+${-diff}`;
}
function wkRange(a,b,cap){
  const out=[]; if(!a||!b) return out;
  let d=parseYMD(a); const end=parseYMD(b);
  while(d<=end && out.length<(cap||60)){ out.push(dstr(d)); d=addDays(d,1); }
  return out;
}
const WK_WD=['일','월','화','수','목','금','토'];

/* ---- 달력 ---- */
function workCalendarHTML(){
  const cfg=wkCfg();
  const mon=cfg.weekStartsMonday, weeks=cfg.weeks;
  const thisStart=startOfWeek(new Date(),mon);
  let start=wkWeekStart();
  if(start<thisStart){ start=thisStart; state.ui.workStart=dstr(thisStart); }
  const todayS=todayStr();
  const isVis=d=>cfg.days[(d.getDay()+6)%7];
  const slots=[0,1,2,3,4,5,6].filter(i=>isVis(addDays(start,i)));
  const n=slots.length;
  const label=isSameDay(start,thisStart)?'이번 주부터':`${start.getMonth()+1}/${start.getDate()} 주부터`;
  let h=`<div class="wrk-nav"><button data-act="work-prev" aria-label="이전 주" ${isSameDay(start,thisStart)?'disabled class="dis"':''}>‹</button><span data-act="work-thisweek">${label}</span><button data-act="work-next" aria-label="다음 주">›</button></div>`;
  h+=`<div class="wrk-dow" style="grid-template-columns:repeat(${n},1fr)">${slots.map(i=>{const dt=addDays(start,i); const d=dt.getDay(); const hol=koreanHoliday(dstr(dt)); return `<span class="${hol?'holi':d===0?'sun':d===6?'sat':''}">${WK_WD[d]}</span>`;}).join('')}</div>`;
  for(let w=0;w<weeks;w++){
    const ws=addDays(start,w*7);
    const dates=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
    const strs=dates.map(dstr);
    const segs=[];
    state.work.projects.forEach(p=>{
      if(!p.start||!p.end||p.start>p.end) return;
      const a=p.start>strs[0]?p.start:strs[0], b=p.end<strs[6]?p.end:strs[6];
      if(a>b) return;
      const ia=strs.indexOf(a), ib=strs.indexOf(b);
      const inside=slots.filter(i=>i>=ia&&i<=ib);
      if(!inside.length) return;
      segs.push({p,a:slots.indexOf(inside[0]),b:slots.indexOf(inside[inside.length-1]),head:p.start>=strs[0]&&inside[0]===ia,tail:p.end<=strs[6]&&inside[inside.length-1]===ib});
    });
    segs.sort((x,y)=>x.a-y.a||(y.b-y.a)-(x.b-x.a));
    const lanes=[];
    segs.forEach(sg=>{
      let l=lanes.findIndex(last=>last<sg.a);
      if(l<0){ l=lanes.length; lanes.push(-1); }
      lanes[l]=sg.b; sg.lane=l;
    });
    const L=lanes.length;
    h+=`<div class="wrk-week" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:auto ${'18px '.repeat(L)}auto;--cellh:${cfg.cellH}px">`;
    slots.forEach((i,ci)=>{
      const d=dates[i], ds=strs[i];
      const hol=koreanHoliday(ds);
      h+=`<div class="wrk-d ${hol?'holi':d.getDay()===0?'sun':d.getDay()===6?'sat':''} ${ds===todayS?'today':''} ${ds===state.ui.workDate?'sel':''}" style="grid-column:${ci+1};grid-row:1" data-act="work-pick" data-date="${ds}" data-wdate="${ds}" title="${hol?esc(hol):''}">${d.getDate()}</div>`;
    });
    segs.forEach(sg=>{
      const c=sg.p.color, rl=sg.head?'8px':'0', rr=sg.tail?'8px':'0';
      h+=`<div class="wrk-bar" style="grid-column:${sg.a+1}/${sg.b+2};grid-row:${sg.lane+2};background:${hexToRgba(c,0.34)};border-radius:${rl} ${rr} ${rr} ${rl}" data-act="work-editproj" data-id="${sg.p.id}">${sg.head?`<span class="wrk-bar-handle l" data-act="work-noop"></span>`:''}${esc(sg.p.name)}${sg.tail?`<span class="wrk-bar-handle r" data-act="work-noop"></span>`:''}</div>`;
    });
    slots.forEach((i,ci)=>{
      const ds=strs[i];
      const ts=wkTasksOn(ds);
      const chips=ts.slice(0,2).map(t=>`<span class="wrk-chip ${t.done?'done':''}"><i style="background:${(wkProject(t.projectId)||{color:'#C7C4D6'}).color}"></i>${esc(t.title)}</span>`).join('');
      const more=ts.length>2?`<span class="wrk-more1">+${ts.length-2}</span>`:'';
      h+=`<div class="wrk-c ${ds===state.ui.workDate?'sel':''}" style="grid-column:${ci+1};grid-row:${L+2}" data-act="work-pick" data-date="${ds}" data-wdate="${ds}">${chips}${more}</div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="wrk-puller" data-act="work-weeks"><i></i><span>${weeks}주</span></div>`;
  return h;
}

/* ---- 달력에서 날짜를 쭉 끌면 새 프로젝트 ---- */
function bindWorkCalendarDrag(){
  const cal=document.getElementById('wrkCal'); if(!cal) return;
  let drag=null;
  let resize=null;
  const clear=()=>cal.querySelectorAll('.rng').forEach(c=>c.classList.remove('rng'));
  const paint=()=>{
    const lo=drag.a<drag.b?drag.a:drag.b, hi=drag.a<drag.b?drag.b:drag.a;
    cal.querySelectorAll('[data-wdate]').forEach(c=>c.classList.toggle('rng',drag.a!==drag.b && c.dataset.wdate>=lo && c.dataset.wdate<=hi));
  };
  const paintResize=()=>{
    const other=resize.edge==='l'?resize.end:resize.start;
    const lo=other<resize.cur?other:resize.cur, hi=other<resize.cur?resize.cur:other;
    cal.querySelectorAll('[data-wdate]').forEach(c=>c.classList.toggle('rng',c.dataset.wdate>=lo && c.dataset.wdate<=hi));
  };
  cal.addEventListener('pointerdown',e=>{
    const handle=e.target.closest('.wrk-bar-handle');
    if(handle){
      const bar=handle.closest('.wrk-bar');
      const p=wkProject(bar.dataset.id);
      if(!p) return;
      const edge=handle.classList.contains('l')?'l':'r';
      resize={pid:p.id,edge,start:p.start,end:p.end,cur:edge==='l'?p.start:p.end};
      return;
    }
    const c=e.target.closest('[data-wdate]');
    if(!c||e.target.closest('.wrk-bar')) return;
    drag={a:c.dataset.wdate,b:c.dataset.wdate};
  });
  cal.addEventListener('pointermove',e=>{
    if(resize){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const c=el&&el.closest?el.closest('[data-wdate]'):null;
      if(c && c.closest('#wrkCal') && c.dataset.wdate!==resize.cur){ resize.cur=c.dataset.wdate; paintResize(); }
      return;
    }
    if(!drag) return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const c=el&&el.closest?el.closest('[data-wdate]'):null;
    if(c && c.closest('#wrkCal') && c.dataset.wdate!==drag.b){ drag.b=c.dataset.wdate; paint(); }
  });
  cal.addEventListener('pointerup',()=>{
    if(resize){
      const r=resize; resize=null; clear();
      const p=wkProject(r.pid);
      if(p){
        if(r.edge==='l'){ p.start = r.cur<=p.end? r.cur : p.end; }
        else { p.end = r.cur>=p.start? r.cur : p.start; }
        render();
      }
      return;
    }
    if(!drag) return;
    const d=drag; drag=null; clear();
    if(d.a!==d.b) openWorkProjectEditor({start:d.a<d.b?d.a:d.b, end:d.a<d.b?d.b:d.a});
  });
  cal.addEventListener('pointercancel',()=>{ drag=null; resize=null; clear(); });
}

/* ---- 프로젝트 만들기 / 고치기 (모달: 날짜별 할 일 칩 입력 · 시간 · 아래로 복사) ---- */
let _pe=null;
const CLOCK_SVG_SM='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const CHEV_SVG_SM='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function openWorkProjectEditor(opts){
  opts=opts||{};
  const p=opts.id?wkProject(opts.id):null;
  _pe={id:p?p.id:null, always:!!(p&&p.always), name:p?p.name:'',
    color:p?p.color:RAINBOW15[(state.work.projects.length*4+3)%RAINBOW15.length],
    start:p?p.start:opts.start, end:p?p.end:opts.end, rows:{}, open:{}, pending:{}, editDates:false, focus:null};
  if(p && p.start && p.end){
    state.work.tasks.filter(t=>t.projectId===p.id).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(t=>{
      if(!t.date) return;
      const r=peRow(t.date);
      if(!r.items.length){ r.allDay=!t.startTime; r.time=t.startTime||'10:00'; r.dur=t.duration||60; }
      r.items.push({id:t.id,text:t.title});
    });
  }
  renderWorkProjectEditor();
}
function peRow(ds){
  if(!_pe.rows[ds]) _pe.rows[ds]={items:[],allDay:true,time:'10:00',dur:60,below:false,cnt:0,touched:false};
  return _pe.rows[ds];
}
function peDates(){ return _pe.always?[]:wkRange(_pe.start,_pe.end); }
function pePullPending(){
  document.querySelectorAll('#modalbox .pe-in').forEach(inp=>{ _pe.pending[inp.dataset.d]=inp.value; });
  const nm=document.querySelector('#modalbox .pe-name'); if(nm) _pe.name=nm.value;
}
function peCommitPending(ds){
  const t=(_pe.pending[ds]||'').trim();
  if(t){ peRow(ds).items.push({id:null,text:t}); }
  _pe.pending[ds]='';
}
function peApplyBelow(ds){
  const dates=peDates(), i=dates.indexOf(ds), r=peRow(ds);
  if(!r.below) return;
  dates.slice(i+1).forEach(d=>{ const x=peRow(d); x.allDay=r.allDay; x.time=r.time; x.dur=r.dur; x.touched=true; });
}
function peChipsHTML(ds){
  return peRow(ds).items.map((it,i)=>`<span class="pe-chip">${esc(it.text)}<button type="button" data-pe="delchip" data-d="${ds}" data-i="${i}" aria-label="삭제">✕</button></span>`).join('');
}
function peRowHTML(ds){
  const r=peRow(ds), d=parseYMD(ds), open=!!_pe.open[ds];
  return `<div class="pe-row" data-d="${ds}">
    <div class="pe-line">
      <span class="pe-date">${pad2(d.getMonth()+1)}/${pad2(d.getDate())}</span>
      <div class="pe-pill"><span class="pe-chips">${peChipsHTML(ds)}</span><input class="pe-in" type="text" data-d="${ds}" value="${esc(_pe.pending[ds]||'')}" enterkeyhint="done" autocomplete="off"></div>
      <button type="button" class="pe-btn ${!r.allDay?'on':''}" data-pe="clock" data-d="${ds}" aria-label="시간">${CLOCK_SVG_SM}</button>
      <button type="button" class="pe-btn ${r.cnt?'on':''}" data-pe="down" data-d="${ds}" aria-label="아래로 복사">${CHEV_SVG_SM}${r.cnt?`<b>${r.cnt}</b>`:''}</button>
    </div>
    ${open?`<div class="np-time">
      <div class="np-seg"><button type="button" class="${r.allDay?'on':''}" data-pe="allday" data-d="${ds}">종일</button><button type="button" class="${!r.allDay?'on':''}" data-pe="timed" data-d="${ds}">시간</button></div>
      ${r.allDay?'':`<div class="np-tt"><input type="time" data-pe="time" data-d="${ds}" value="${r.time}"><select data-pe="dur" data-d="${ds}">${wkDurOptions(r.dur)}</select></div><div class="np-sum">${r.time}부터 ${wkFmtDur(r.dur)}</div>`}
      <label class="np-chk"><input type="checkbox" data-pe="below" data-d="${ds}" ${r.below?'checked':''}> 아래 날짜도 같은 시간으로</label>
    </div>`:''}
  </div>`;
}
function renderWorkProjectEditor(){
  const s=_pe, box=document.getElementById('modalbox'), overlay=document.getElementById('overlay');
  const prev=box.querySelector('.pe-scroll'); const keep=prev?prev.scrollTop:0;
  const dates=peDates();
  const isEdit=!!s.id;
  const fmt=x=>{const d=parseYMD(x); return pad2(d.getMonth()+1)+'/'+pad2(d.getDate());};
  overlay.classList.add('show'); box.classList.add('show'); box.classList.remove('blk'); box.classList.add('pe');
  box.innerHTML=`<h3 class="pe-title">📁 ${isEdit?'프로젝트 고치기':'새 프로젝트'}</h3>
    ${s.always?'':`<div class="pe-range" data-pe="range">${fmt(s.start)} ~ ${fmt(s.end)}</div>
    ${s.editDates?`<div class="row2 pe-dates"><div><input type="date" id="pe_start" value="${s.start}"></div><div><input type="date" id="pe_end" value="${s.end}"></div></div>`:''}`}
    <div class="pe-scroll">
      <input class="pe-name" type="text" placeholder="프로젝트 이름" value="${esc(s.name)}">
      ${s.always?'':`<div class="pe-hint">날짜별 할일 — 쓰고 엔터 · 🕒 시간 · ⌄ 아래로 복사</div>
      <div class="pe-rows">${dates.map(peRowHTML).join('')}</div>
      ${wkRange(s.start,s.end,61).length>60?'<div class="hint">최대 60일까지 입력할 수 있어요.</div>':''}`}
      <div class="pe-colors">${RAINBOW15.map(c=>`<span class="pe-sw ${c.toUpperCase()===s.color.toUpperCase()?'sel':''}" data-c="${c}" style="background:${c}"></span>`).join('')}</div>
    </div>
    <div class="modalfooter"><button class="cancel" id="pe_cancel">취소</button>${isEdit&&!s.always?'<button class="pe-del" id="pe_del">삭제</button>':''}<button class="ok" id="pe_save">${isEdit?'저장':'만들기'}</button></div>`;
  const sc=box.querySelector('.pe-scroll'); sc.scrollTop=keep;
  box.querySelector('.pe-name').addEventListener('input',e=>{ s.name=e.target.value; });
  const rng=box.querySelector('[data-pe=range]'); if(rng) rng.onclick=()=>{ pePullPending(); s.editDates=!s.editDates; renderWorkProjectEditor(); };
  const onDate=()=>{
    let a=box.querySelector('#pe_start').value, b=box.querySelector('#pe_end').value;
    if(!a||!b) return; if(a>b){ const x=a; a=b; b=x; }
    pePullPending(); s.start=a; s.end=b; renderWorkProjectEditor();
  };
  const ps=box.querySelector('#pe_start'), pe2=box.querySelector('#pe_end');
  if(ps) ps.addEventListener('change',onDate); if(pe2) pe2.addEventListener('change',onDate);
  // 칩 입력
  const refreshChips=ds=>{ const row=box.querySelector(`.pe-row[data-d="${ds}"] .pe-chips`); if(row) row.innerHTML=peChipsHTML(ds); bindChipDel(row); };
  const bindChipDel=(root)=>{ if(!root) return; root.querySelectorAll('[data-pe=delchip]').forEach(b=>b.onclick=()=>{ peRow(b.dataset.d).items.splice(+b.dataset.i,1); refreshChips(b.dataset.d); }); };
  box.querySelectorAll('.pe-chips').forEach(bindChipDel);
  box.querySelectorAll('.pe-in').forEach(inp=>{
    const ds=inp.dataset.d;
    inp.addEventListener('input',()=>{ _pe.pending[ds]=inp.value; });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); const t=inp.value.trim(); if(t){ peRow(ds).items.push({id:null,text:t}); inp.value=''; _pe.pending[ds]=''; refreshChips(ds); } }
      else if(e.key==='Backspace' && !inp.value){ const it=peRow(ds).items; if(it.length){ it.pop(); refreshChips(ds); } }
    });
  });
  box.querySelectorAll('.pe-pill').forEach(pill=>pill.addEventListener('click',e=>{ if(e.target===pill) pill.querySelector('.pe-in').focus(); }));
  // 시간 / 복사
  box.querySelectorAll('[data-pe]').forEach(el=>{
    const k=el.dataset.pe, ds=el.dataset.d;
    if(!ds || k==='delchip') return;
    if(el.tagName==='BUTTON'){
      el.addEventListener('click',()=>{
        pePullPending();
        const r=peRow(ds);
        if(k==='clock'){ _pe.open[ds]=!_pe.open[ds]; }
        else if(k==='allday'){ r.allDay=true; r.touched=true; peApplyBelow(ds); }
        else if(k==='timed'){ r.allDay=false; r.touched=true; peApplyBelow(ds); }
        else if(k==='down'){
          peCommitPending(ds);
          if(!r.items.length){ renderWorkProjectEditor(); return; }
          r.cnt++;
          const ds2=peDates(), i=ds2.indexOf(ds);
          for(let j=1;j<=r.cnt;j++){
            const t=ds2[i+j]; if(!t) break;
            const x=peRow(t);
            x.items=x.items.filter(it=>it.id);              // 이미 저장된 할 일은 유지, 입력만 하고 저장 전인 것은 덮어쓰기
            r.items.forEach(it=>{ if(!x.items.some(y=>y.text===it.text)) x.items.push({id:null,text:it.text}); });
            x.allDay=r.allDay; x.time=r.time; x.dur=r.dur; x.touched=true;
          }
        }
        renderWorkProjectEditor();
      });
    } else {
      el.addEventListener('change',()=>{
        pePullPending();
        const r=peRow(ds);
        if(k==='time') r.time=el.value||r.time;
        else if(k==='dur') r.dur=+el.value;
        else if(k==='below') r.below=el.checked;
        r.touched=true; peApplyBelow(ds);
        renderWorkProjectEditor();
      });
    }
  });
  box.querySelectorAll('.pe-sw').forEach(sw=>sw.onclick=()=>{ s.color=sw.dataset.c; box.querySelectorAll('.pe-sw').forEach(x=>x.classList.toggle('sel',x===sw)); });
  box.querySelector('#pe_cancel').onclick=()=>{ _pe=null; closeModal(); };
  const del=box.querySelector('#pe_del');
  if(del) del.onclick=()=>{
    askConfirm('프로젝트를 삭제할까요? 할 일은 "상시"로 옮겨져요.',()=>{
      const dp=wkDefaultProject(), id=s.id;
      state.work.tasks.forEach(t=>{ if(t.projectId===id) t.projectId=dp.id; });
      state.work.memos.forEach(m=>{ if(m.projectId===id) m.projectId=null; });
      state.work.projects=state.work.projects.filter(x=>x.id!==id);
      _pe=null; closeModal(); render();
    });
  };
  box.querySelector('#pe_save').onclick=()=>{
    pePullPending();
    peDates().forEach(ds=>peCommitPending(ds));
    const name=(s.name||'').trim()||(isEdit?(wkProject(s.id)||{}).name:'')||'새 프로젝트';
    let p=isEdit?wkProject(s.id):null;
    if(p){ p.name=name; p.color=s.color; if(!p.always){ p.start=s.start; p.end=s.end; } }
    else { p={id:uid(),name,color:s.color,start:s.start,end:s.end,always:false,order:state.work.projects.length}; state.work.projects.push(p); }
    peDates().forEach(ds=>{
      const r=s.rows[ds]; if(!r) return;
      const keep=r.items.filter(i=>i.id).map(i=>i.id);
      state.work.tasks=state.work.tasks.filter(t=>!(t.projectId===p.id && t.date===ds && !keep.includes(t.id)));
      r.items.forEach(it=>{
        if(it.id){ const t=wkTask(it.id); if(t && r.touched){ t.startTime=r.allDay?null:r.time; t.duration=r.dur; } }
        else wkAddTask(it.text,{projectId:p.id,date:ds,startTime:r.allDay?null:r.time,duration:r.dur});
      });
    });
    if(!isEdit){
      state.ui.workDate=s.start;
      state.ui.workStart=null;
      const cur=wkWeekStart(), st=startOfWeek(parseYMD(s.start),wkCfg().weekStartsMonday);
      if(st>cur) state.ui.workStart=dstr(st);
      state.ui.workSub='today';
    }
    _pe=null; closeModal(); render();
  };
}

function wkPlaceMenu(menu,btn){
  document.body.appendChild(menu);
  const r=btn.getBoundingClientRect(), mw=menu.offsetWidth, mh=menu.offsetHeight;
  const left=Math.min(Math.max(8,r.right-mw),window.innerWidth-mw-8);
  let top=r.bottom+4; if(top+mh>window.innerHeight-8) top=Math.max(8,r.top-mh-4);
  menu.style.left=left+'px'; menu.style.top=top+'px';
}

/* ---- 검색 ---- */
function mdShort(ds){ if(!ds) return ''; const d=parseYMD(ds); return `${d.getMonth()+1}/${d.getDate()}`; }
function searchAll(q){
  q=q.trim().toLowerCase();
  if(!q) return [];
  const res=[];
  topTasks().forEach(t=>{
    if(t.title.toLowerCase().includes(q)) res.push({type:'task',label:'할일',id:t.id,title:t.title,sub:t.date?mdShort(t.date)+(t.startTime?' · '+t.startTime:''):'날짜 없음'});
  });
  state.work.projects.forEach(p=>{
    if(p.name.toLowerCase().includes(q)) res.push({type:'project',label:'프로젝트',id:p.id,title:p.name,sub:p.always?'상시':(p.start&&p.end?`${mdShort(p.start)}~${mdShort(p.end)}`:'')});
  });
  state.work.tasks.forEach(t=>{
    if(t.title.toLowerCase().includes(q)) res.push({type:'worktask',label:'작업',id:t.id,title:t.title,sub:t.date?mdShort(t.date):'날짜 미정'});
  });
  state.work.memos.forEach(m=>{
    if((m.text||'').toLowerCase().includes(q)) res.push({type:'memo',label:'메모',id:m.id,title:m.text,sub:'작업 메모'});
  });
  return res.slice(0,40);
}
function searchResultsHTML(q){
  const items=searchAll(q);
  if(!q.trim()) return `<div class="hint" style="padding:14px 2px">할 일, 프로젝트, 메모 제목으로 찾아봐요.</div>`;
  if(!items.length) return `<div class="hint" style="padding:14px 2px">"${esc(q)}" 결과가 없어요.</div>`;
  return items.map(r=>`<div class="srch-row" data-act="srch-go" data-type="${r.type}" data-id="${r.id}">
    <span class="srch-tag">${r.label}</span>
    <span class="srch-ttl">${esc(r.title)}</span>
    <span class="srch-sub">${esc(r.sub)}</span>
  </div>`).join('');
}

    <div class="wrk-set col"><span class="lab">보이는 요일</span><div class="wrk-days">${dayNames.map((n,i)=>`<button type="button" class="${cfg.days[i]?'on':''}" data-wd="${i}">${n}</button>`).join('')}</div></div>
    <div class="wrk-set col"><span class="lab">글자 크기 <b id="ws_fontv">${cfg.fontScale}%</b></span><input type="range" id="ws_font" min="80" max="130" step="5" value="${cfg.fontScale}"></div>
    <div class="wrk-set"><span class="lab">다른 탭과 연동 · 일간</span><div class="switch ${cfg.linkDaily?'on':''}" data-wt="linkDaily"><i></i></div></div>
    <div class="wrk-set"><span class="lab">다른 탭과 연동 · 주간</span><div class="switch ${cfg.linkWeekly?'on':''}" data-wt="linkWeekly"><i></i></div></div>
    <div class="wrk-set"><span class="lab">시간표 범위</span>${seg('timeAuto',[[true,'자동'],[false,'직접']])}</div>
    ${cfg.timeAuto?'':`<div class="wrk-set"><span class="lab">시작 · 종료</span><div class="wrk-tr"><select id="ws_ts">${hoursOpt(0,23,cfg.timeStart)}</select><span>~</span><select id="ws_te">${hoursOpt(1,24,cfg.timeEnd)}</select></div></div>`}
    <div class="wrk-set"><span class="lab">한 시간 높이</span>${seg('rowAuto',[[true,'자동'],[false,'직접']])}</div>
    ${cfg.rowAuto?'':`<div class="wrk-set col"><span class="lab">높이 <b id="ws_rowv">${cfg.rowH}px</b></span><input type="range" id="ws_row" min="36" max="100" step="4" value="${cfg.rowH}"></div>`}
    <div class="wrk-set"><span class="lab">달력에 보일 주 수</span>${seg('weeks',[[1,'1'],[2,'2'],[3,'3'],[4,'4']])}</div>
    <div class="wrk-set col"><span class="lab">칸 높이 <b id="ws_cellv">${cfg.cellH}px</b></span><input type="range" id="ws_cell" min="24" max="80" step="2" value="${cfg.cellH}"></div>
    <button class="primarybtn" id="ws_close">닫기</button>`;
  sheet.scrollTop=keep;
  const reopen=()=>{ render(); openWorkSettings(); };
  sheet.querySelectorAll('[data-ws]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ws, v=JSON.parse(b.dataset.v);
    if(cfg[k]===v) return;
    cfg[k]=v;
    if(k==='weekStartsMonday') state.ui.workStart=null;
    reopen();
  });
  sheet.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.wd;
    if(cfg.days[i] && cfg.days.filter(Boolean).length===1) return;
    cfg.days[i]=!cfg.days[i]; reopen();
  });
  sheet.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{ cfg[b.dataset.wt]=!cfg[b.dataset.wt]; reopen(); });
  const bindRange=(id,key,labId,unit)=>{ const el=sheet.querySelector('#'+id); if(!el) return; el.addEventListener('input',()=>{ cfg[key]=+el.value; sheet.querySelector('#'+labId).textContent=el.value+unit; render(); }); };
  bindRange('ws_font','fontScale','ws_fontv','%');
  bindRange('ws_row','rowH','ws_rowv','px');
  bindRange('ws_cell','cellH','ws_cellv','px');
  const ts=sheet.querySelector('#ws_ts'), te=sheet.querySelector('#ws_te');
  if(ts) ts.onchange=()=>{ cfg.timeStart=+ts.value; if(cfg.timeEnd<=cfg.timeStart) cfg.timeEnd=Math.min(24,cfg.timeStart+1); reopen(); };
  if(te) te.onchange=()=>{ cfg.timeEnd=+te.value; if(cfg.timeEnd<=cfg.timeStart) cfg.timeStart=Math.max(0,cfg.timeEnd-1); reopen(); };
  sheet.querySelector('#ws_close').onclick=closeSheet;
}

/* ---- 클릭 ---- */
function workClick(act,el){
  if(act!=='work-more' && act!=='work-memomenu') closePopovers();
  if(act==='work-sub'){ state.ui.workSub=el.dataset.v; render(); return; }
  if(act==='work-prev'){ const th=startOfWeek(new Date(),wkCfg().weekStartsMonday), pv=addDays(wkWeekStart(),-7); if(pv<th) return; state.ui.workStart=dstr(pv); render(); return; }
  if(act==='work-next'){ state.ui.workStart=dstr(addDays(wkWeekStart(),7)); render(); return; }
  if(act==='work-thisweek'){ state.ui.workStart=null; state.ui.workDate=todayStr(); render(); return; }
  if(act==='work-weeks'){ const c=wkCfg(); c.weeks=c.weeks>=4?1:c.weeks+1; render(); return; }
  if(act==='work-settings'){ openWorkSettings(); return; }
  if(act==='work-pick'){ state.ui.workDate=el.dataset.date; render(); return; }
  if(act==='work-toggle'){ const t=wkTask(el.dataset.id); if(t){ t.done=!t.done; t.doneAt=t.done?Date.now():null; } render(); return; }
  if(act==='work-more'){ openWorkMenu(el.dataset.id,el); return; }
  if(act==='work-edit'){ openWorkTaskModal(el.dataset.id); return; }
  if(act==='work-addin'){
    const pid=el.dataset.pid;
    inlineInputAt(el,'',v=>{ wkAddTask(v,{projectId:pid,date:state.ui.workDate}); render(); });
    return;
  }
  if(act==='work-quickadd'){ workQuickAdd(); return; }
  if(act==='work-undtoggle'){ state.ui.workUndatedOpen=!state.ui.workUndatedOpen; render(); return; }
  if(act==='work-setdate'){
    const id=el.dataset.id;
    openWorkDateModal('📌 어느 날 할일로?',v=>{ const t=wkTask(id); if(t){ t.date=v; state.ui.workDate=v; state.ui.workStart=null; } render(); });
    return;
  }
  if(act==='work-memoproj'){ state.ui.workMemoPid=el.dataset.pid||null; render(); return; }
  if(act==='work-memoadd'){ workMemoAdd(); return; }
  if(act==='work-memomenu'){ openWorkMemoMenu(el.dataset.id,el); return; }
  if(act==='work-memodel'){ state.work.memos=state.work.memos.filter(m=>m.id!==el.dataset.id); render(); return; }
  if(act==='work-memo2task'){
    const id=el.dataset.id, m=state.work.memos.find(x=>x.id===id); if(!m) return;
    openWorkDateModal('📌 어느 날 할일로?',v=>{
      wkAddTask(m.text,{date:v,projectId:m.projectId||wkDefaultProject().id});
      state.work.memos=state.work.memos.filter(x=>x.id!==id);
      render();
    });
    return;
  }
  if(act==='work-editproj'){ openWorkProjectEditor({id:el.dataset.id}); return; }
}

/* ============== 이벤트 위임 ============== */
document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-act]');
  const overlay=document.getElementById('overlay');
  if(e.target.id==='overlay'){closeSheet();closeModal();closePopovers();return;}
  if(!el){ if(!e.target.closest('.popover') && !e.target.closest('.dropdown')) closePopovers(); return; }
  const act=el.dataset.act;
  if(act.startsWith('work-')){ workClick(act,el); return; }

  if(act==='toggle'){
    const t0=taskById(el.dataset.id);
    const wasDone = t0 ? t0.completed : false;
    const rect = el.getBoundingClientRect();
    toggleComplete(el.dataset.id);
    const t1=taskById(el.dataset.id);
    if(t1 && t1.completed && !wasDone) celebrateAt(rect);
    return;
  }
  if(act==='edit-title-inline'){startInlineTitleEdit(el);return;}
  if(act==='edit-time-inline'){startInlineTimeEdit(el);return;}
  if(act==='month-gear'){
    const existing=document.getElementById('monthPop');
    if(existing){ closePopovers(); return; }
    openMonthPopover(e);
    return;
  }
  if(act==='delete'){deleteTask(el.dataset.id);return;}
  if(act==='exec'){
    if(_execLPFired){ _execLPFired=false; return; }
    const t=taskById(el.dataset.id);
    if(t.activeExecution) stopExec(t.id); else startExec(t.id);
    return;
  }
  if(act==='stopexec'){stopExec(el.dataset.id);return;}
  if(act==='complete'){taskById(el.dataset.id).completed=true;render();return;}
  if(act==='uncomplete'){taskById(el.dataset.id).completed=false;render();return;}
  if(act==='restore'){const t=taskById(el.dataset.id);t.completed=false;childrenOf(t.id).forEach(k=>k.completed=false);render();return;}
  if(act==='more'){const r=el.getBoundingClientRect();openMoreMenu(el.dataset.id,r.left-100,r.bottom+window.scrollY+4);return;}
  if(act==='week-catpick'){openCategoryModal(el.dataset.id);return;}
  if(act==='dump-more'){
    const t=taskById(el.dataset.id);
    const r=el.getBoundingClientRect();
    const key='dumpmore:'+el.dataset.id;
    if(_openPopTrigger===key){ closePopovers(); return; }
    closePopovers();
    _openPopTrigger=key;
    const menu=document.createElement('div');
    menu.className='dropdown';menu.style.left=(r.left-140)+'px';menu.style.top=(r.bottom+window.scrollY+4)+'px';
    menu.innerHTML=`<div class="it" data-m="week">${CALPLUS_SVG} 주간으로</div><div class="it" data-m="today">${CLOCK_SVG} 오늘로</div><div class="it" data-m="archive">${STAR_SVG} 보관함에</div>`;
    document.getElementById('shell').appendChild(menu);
    menu.querySelectorAll('.it').forEach(it=>it.onclick=()=>{
      const m=it.dataset.m;
      if(m==='week') t.date=dstr(state.ui.weekCursor);
      else if(m==='today') t.date=todayStr();
      else if(m==='archive') t.archived=true;
      closePopovers(); render();
    });
    return;
  }

  if(act==='edit-task'){openEditModal(el.dataset.id);return;}
  if(act==='srch-go'){
    closeSheet();
    const id=el.dataset.id;
    if(el.dataset.type==='task'){
      const t=taskById(id);
      if(t){
        if(t.date){ state.ui.tab='daily'; state.ui.dailyDate=t.date; render(); }
        else { state.ui.tab='dump'; render(); }
        if(t.startTime) setTimeout(()=>openBlockModal({id:t.id}),80);
      }
    } else if(el.dataset.type==='project'){
      state.ui.tab='work'; render();
      setTimeout(()=>openWorkProjectEditor({id}),80);
    } else if(el.dataset.type==='worktask'){
      const t=wkTask(id);
      if(t){ state.ui.tab='work'; state.ui.workSub='today'; if(t.date) state.ui.workDate=t.date; render(); }
    } else if(el.dataset.type==='memo'){
      state.ui.tab='work'; state.ui.workSub='memo'; render();
    }
    return;
  }
  if(act==='edit-execlog'){openExecLogModal(el.dataset.id,+el.dataset.idx);return;}

  // DAILY
  if(act==='daily-today'){state.ui.dailyDate=todayStr();render();return;}
  if(act==='daily-prev'){state.ui.dailyDate=dstr(addDays(parseYMD(state.ui.dailyDate),-1));render();return;}
  if(act==='daily-next'){state.ui.dailyDate=dstr(addDays(parseYMD(state.ui.dailyDate),1));render();return;}
  if(act==='open-timetable'){
    state.ui.ttCursor=startOfWeek(parseYMD(state.ui.dailyDate),state.settings.weekStartsMonday);
    openWeekTimetable();
    return;
  }
  if(act==='sleep-mark'){
    const kind=el.dataset.kind, date=el.dataset.date;
    const now=new Date();
    const hhmm=pad2(now.getHours())+':'+pad2(now.getMinutes());
    if(kind==='wakeAt' && !(state.sleep[date] && state.sleep[date].sleepAt)){
      const prevDate=dstr(addDays(parseYMD(date),-1));
      if(state.sleep[prevDate] && state.sleep[prevDate].sleepAt && !state.sleep[prevDate].wakeAt){
        state.sleep[prevDate].wakeAt=hhmm;
        render();return;
      }
    }
    if(!state.sleep[date]) state.sleep[date]={};
    state.sleep[date][kind]=hhmm;
    render();return;
  }
  if(act==='sleep-edit-open'){
    openSleepEditModal(el.dataset.date);
    return;
  }
  if(act==='sleep-period'){state.ui.sleepPeriod=+el.dataset.v;render();return;}
  if(act==='sleep-csv'){downloadSleepCSV();return;}
  if(act==='missedbar-close'){_missedNotices=[];renderMissedBar();return;}
  if(act==='toggle-workproj-month'){state.settings.showWorkProjectsMonth=!state.settings.showWorkProjectsMonth;render();openMonthPopoverKeep();return;}
  if(act==='month-workproj-open'){openWorkProjectEditor({id:el.dataset.id});return;}
  if(act==='tt-close'){closeWeekTimetable();return;}
  if(act==='tt-prev'){state.ui.ttCursor=addDays(state.ui.ttCursor,-7);renderWeekTimetable();return;}
  if(act==='tt-next'){state.ui.ttCursor=addDays(state.ui.ttCursor,7);renderWeekTimetable();return;}
  if(act==='tt-today'){state.ui.ttCursor=startOfWeek(new Date(),state.settings.weekStartsMonday);renderWeekTimetable();return;}
  if(act==='daily-filter'){state.ui.dailyCatFilter=el.dataset.cat;render();return;}

  // WEEK
  if(act==='week-prev'){state.ui.weekDraft=null;state.ui.weekCursor=addDays(state.ui.weekCursor,-7);state.ui.weekSelectedDate=null;render();return;}
  if(act==='week-next'){state.ui.weekDraft=null;state.ui.weekCursor=addDays(state.ui.weekCursor,7);state.ui.weekSelectedDate=null;render();return;}
  if(act==='week-today'){state.ui.weekDraft=null;state.ui.weekCursor=startOfWeek(new Date(),state.settings.weekStartsMonday);state.ui.weekSelectedDate=null;render();return;}
  if(act==='open-weekcal'){ state.ui.weekCalCursor=state.ui.weekCursor; openWeekCalGrid(); return; }
  if(act==='wkcal-close'){ closeWeekCalGrid(); return; }
  if(act==='wkcal-prev'){ state.ui.weekCalCursor=addDays(state.ui.weekCalCursor,-7); renderWeekCalGrid(); return; }
  if(act==='wkcal-next'){ state.ui.weekCalCursor=addDays(state.ui.weekCalCursor,7); renderWeekCalGrid(); return; }
  if(act==='wkcal-today'){ state.ui.weekCalCursor=startOfWeek(new Date(),state.settings.weekStartsMonday); renderWeekCalGrid(); return; }
  if(act==='week-daypick'){
    state.ui.weekSelectedDate=el.dataset.date;
    state.ui.weekDraft=null;
    render();return;
  }
  if(act==='week-clearfilter'){state.ui.weekSelectedDate=null;render();return;}
  if(act==='week-addtop'){
    state.ui.weekDraft={pos:weekTasks().filter(t=>!isChecked(t)).length,text:''};
    render();return;
  }
  if(act==='week-insert'){
    state.ui.weekDraft={pos:+el.dataset.pos||0,text:''};
    render();return;
  }
  if(act==='week-draft-cancel'){cancelWeekDraft();return;}
  if(act==='week-addchild'){
    const rowEl=el.closest('.wk2-row, .wkcal-row')||el;
    inlineInputAt(rowEl,'',v=>{addChildTask(el.dataset.id,v);render();},false,true);
    return;
  }
  if(act==='toggle-donearea'){state.ui.doneAreaOpen=!state.ui.doneAreaOpen;render();return;}
  if(act==='toggle-archivearea'){state.ui.archiveAreaOpen=!state.ui.archiveAreaOpen;render();return;}
  if(act==='unarchive'){taskById(el.dataset.id).archived=false;render();return;}

  // MONTH
  if(act==='month-prev'){state.ui.monthCursor=new Date(state.ui.monthCursor.getFullYear(),state.ui.monthCursor.getMonth()-1,1);render();return;}
  if(act==='month-next'){state.ui.monthCursor=new Date(state.ui.monthCursor.getFullYear(),state.ui.monthCursor.getMonth()+1,1);render();return;}
  if(act==='month-today'){const n=new Date();state.ui.monthCursor=new Date(n.getFullYear(),n.getMonth(),1);state.ui.monthSelected=todayStr();render();return;}
  if(act==='month-filter'){state.ui.monthCatFilter=el.dataset.cat;render();return;}
  if(act==='month-pick'){state.ui.monthSelected=el.dataset.date;render();return;}
  if(act==='goto-week'){
    state.ui.weekCursor=startOfWeek(parseYMD(state.ui.monthSelected),state.settings.weekStartsMonday);
    state.ui.weekSelectedDate=state.ui.monthSelected;
    state.ui.tab='week';render();return;
  }
  if(act==='month-quickadd'){
    const v=document.getElementById('monthQuickInput').value;
    if(v.trim()){addTopTask(v,{date:state.ui.monthSelected});render();}
    return;
  }
  if(act==='month-tt-del'){
    const t=taskById(el.dataset.id);
    if(t){ t.executionLogs.splice(+el.dataset.idx,1); render(); }
    return;
  }
  if(act==='month-tt-unsched'){
    const t=taskById(el.dataset.id);
    if(t){ t.startTime=null; render(); }
    return;
  }
  if(act==='set-weekstart'){state.settings.weekStartsMonday=(el.dataset.v==='mon');render();openMonthPopoverKeep();return;}
  if(act==='toggle-showcompleted'){state.settings.showCompletedMonth=!state.settings.showCompletedMonth;render();openMonthPopoverKeep();return;}
  if(act==='set-density'){state.settings.monthDensity=el.dataset.v;render();openMonthPopoverKeep();return;}
  if(act==='toggle-hiderepeat'){state.settings.hideRepeatMonth=!state.settings.hideRepeatMonth;render();openMonthPopoverKeep();return;}
  if(act==='toggle-notify'){
    if(state.settings.notifyEnabled){
      state.settings.notifyEnabled=false;
      render();
      return;
    }
    if(typeof Notification==='undefined'){
      notice('이 브라우저(또는 이 화면)에서는 알림을 지원하지 않아요. 홈 화면에 추가한 뒤 다시 시도해보세요.');
      return;
    }
    if(Notification.permission==='granted'){
      state.settings.notifyEnabled=true; render(); return;
    }
    if(Notification.permission==='denied'){
      notice('알림 권한이 차단돼 있어요. 브라우저(또는 기기) 설정에서 이 사이트의 알림 권한을 허용해주세요.');
      return;
    }
    Notification.requestPermission().then(perm=>{
      if(perm==='granted'){ state.settings.notifyEnabled=true; render(); }
      else { notice('알림 권한이 거부됐어요. 브라우저 설정에서 허용해주세요.'); }
    }).catch(()=>{ notice('알림 권한을 요청하지 못했어요.'); });
    return;
  }
  if(act==='toggle-dailysummary'){
    state.settings.dailySummaryEnabled=!state.settings.dailySummaryEnabled;
    if(state.settings.dailySummaryEnabled && !state.settings.dailySummaryTime) state.settings.dailySummaryTime='08:00';
    state.settings._lastSummaryDate=null;
    render();
    return;
  }

  // DUMP
  if(act==='dump-add'){doDumpAdd();return;}
  if(act==='dump-filter'){state.ui.dumpCatFilter=el.dataset.cat;render();return;}
  if(act==='dump-sortcycle'){
    const order=['최신순','오래된순','이름순'];
    const i=order.indexOf(state.ui.dumpSort);
    state.ui.dumpSort=order[(i+1)%order.length];
    render();return;
  }

  // SETTINGS
  if(act==='settings-tab'){state.ui.settingsTab=el.dataset.v;render();return;}
  if(act==='set-theme'){state.settings.theme=el.dataset.v;render();return;}
  if(act==='reset-theme'){state.settings.theme=PALETTE[2];render();return;}
  if(act==='toggle-tabvis'){
    const k=el.dataset.v; state.settings.tabVisible[k]=!state.settings.tabVisible[k];
    if(state.ui.tab===k && !state.settings.tabVisible[k]) state.ui.tab='settings';
    if(state.settings.startTab===k && !state.settings.tabVisible[k]) state.settings.startTab='daily';
    render();return;
  }
  if(act==='set-starttab'){state.settings.startTab=el.dataset.v;render();return;}
  if(act==='cat-add'){
    const inp=document.getElementById('newCatInput');
    if(inp.value.trim()){
      state.categories.push({id:uid(),name:inp.value.trim(),color:PALETTE[state.categories.length%7],order:state.categories.length});
      render();
    }
    return;
  }
  if(act==='cat-delete'){
    state.categories=state.categories.filter(c=>c.id!==el.dataset.id);
    render();return;
  }
  if(act==='cat-palette'){
    cat(el.dataset.id).color=el.dataset.color;
    render();return;
  }
  if(act==='cat-up'){
    const idx=state.categories.findIndex(c=>c.id===el.dataset.id);
    if(idx>0){
      [state.categories[idx-1],state.categories[idx]]=[state.categories[idx],state.categories[idx-1]];
      state.categories.forEach((c,i)=>c.order=i);
      render();
    }
    return;
  }
  if(act==='cat-down'){
    const idx=state.categories.findIndex(c=>c.id===el.dataset.id);
    if(idx>=0 && idx<state.categories.length-1){
      [state.categories[idx+1],state.categories[idx]]=[state.categories[idx],state.categories[idx+1]];
      state.categories.forEach((c,i)=>c.order=i);
      render();
    }
    return;
  }
  if(act==='set-rowheight'){state.settings.dailyRowHeight=+el.dataset.v;render();return;}
  if(act==='reset-font'){
    document.documentElement.style.setProperty('--font',"-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif");
    state.settings.fontName='기본 폰트';
    state.settings.fontData=null;
    idbDeleteFont();
    const fu=document.getElementById('fontUpload'); if(fu) fu.value='';
    render();return;
  }
  if(act==='open-catmgr'){openCategoryManager();return;}
  if(act==='catmgr-close'){closeCategoryManager();render();return;}
  if(act==='catmgr-togglepalette'){
    catmgrOpenPaletteId = catmgrOpenPaletteId===el.dataset.id? null : el.dataset.id;
    renderCatmgrList();return;
  }
  if(act==='cat-add-mgr'){doAddCategoryMgr();return;}
  if(act==='cat-delete-mgr'){
    state.categories=state.categories.filter(c=>c.id!==el.dataset.id);
    if(catmgrOpenPaletteId===el.dataset.id) catmgrOpenPaletteId=null;
    saveCategories(); renderCatmgrList(); return;
  }
  if(act==='cat-palette-mgr'){
    cat(el.dataset.id).color=el.dataset.color;
    saveCategories(); applyTheme(); renderCatmgrList();
    if(document.getElementById('main')) { /* refresh underlying screen colors lazily on close */ }
    return;
  }
  if(act==='cat-togglevis'){
    const c=cat(el.dataset.id);
    c.visible = c.visible===false ? true : false;
    saveCategories(); renderCatmgrList(); return;
  }
  if(act==='data-export'){
    const blob=new Blob([JSON.stringify({tasks:state.tasks,categories:state.categories,settings:state.settings,sleep:state.sleep,work:state.work},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='planner-backup.json'; a.click();
    return;
  }
  if(act==='data-reset'){
    askConfirm('모든 데이터를 초기화할까요? 되돌릴 수 없어요.',()=>{
      state.tasks=[]; render();
    });
    return;
  }
});

document.addEventListener('input',(e)=>{
  if(e.target.dataset && e.target.dataset.act==='cat-color'){

function inlineInputAt(refEl,val,onSave,insertAfter,minimal){
  closeInlineInputs();
  const wrap=document.createElement('div');
  wrap.className='inlineadd'+(minimal?' minimal':'');
  wrap.innerHTML=minimal
    ? `<input type="text" value="${esc(val)}" placeholder="할 일 입력 후 Enter">`
    : `<input type="text" value="${esc(val)}" placeholder="할 일 입력 후 Enter"><button class="ok">추가</button><button class="cancel">취소</button>`;
  if(insertAfter) refEl.insertAdjacentElement('afterend',wrap);
  else refEl.insertAdjacentElement('afterend',wrap);
  const input=wrap.querySelector('input');
  input.focus();
  let done=false;
  const save=()=>{
    if(done) return; done=true;
    if(input.value.trim()){ onSave(input.value); } else { render(); }
  };
  const okBtn=wrap.querySelector('.ok'); if(okBtn) okBtn.onclick=save;
  const cancelBtn=wrap.querySelector('.cancel'); if(cancelBtn) cancelBtn.onclick=()=>{ done=true; render(); };
  input.addEventListener('keydown',ev=>{ if(ev.key==='Enter') save(); if(ev.key==='Escape'){ done=true; render(); } });
  if(minimal) input.addEventListener('blur',()=>{ setTimeout(save,150); });
}
function closeInlineInputs(){document.querySelectorAll('.inlineadd').forEach(x=>{ if(!x.querySelector('#monthQuickInput')) x.remove(); });}
function startInlineTimeEdit(spanEl){
  const id=spanEl.dataset.id;
  const t=taskById(id);
  if(!t) return;
  const input=document.createElement('input');
  input.type='time';
  input.className='time-input';
  input.value=t.startTime||'';
  spanEl.replaceWith(input);
  input.focus();
  let done=false;
  const finish=(save)=>{
    if(done) return;
    done=true;
    if(save && input.value) t.startTime=input.value;
    render();
  };
  input.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();finish(true);}
    else if(ev.key==='Escape'){ev.preventDefault();finish(false);}
  });
  input.addEventListener('change',()=>finish(true));
  input.addEventListener('blur',()=>finish(true));
}

function startInlineTitleEdit(spanEl){
  const id=spanEl.dataset.id;
  const t=taskById(id);
  if(!t) return;
  const input=document.createElement('input');
  input.type='text';
  input.className = spanEl.classList.contains('t') ? 't-input' : 'wk2-title-input';
  input.value=t.title;
  spanEl.replaceWith(input);
  input.addEventListener('click',ev=>ev.stopPropagation());
  input.focus();
  input.setSelectionRange(input.value.length,input.value.length);
  let done=false;
  const finish=(save)=>{
    if(done) return;
    done=true;
    if(save){
      const v=input.value.trim();
      if(v) t.title=v;
    }
    render();
  };
  input.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();finish(true);}
    else if(ev.key==='Escape'){ev.preventDefault();finish(false);}
  });
  input.addEventListener('blur',()=>finish(true));
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function hexToHsl(hex){
  const h6=(hex||'#97C0F7').replace('#','');
  const r=parseInt(h6.slice(0,2),16)/255,g=parseInt(h6.slice(2,4),16)/255,b=parseInt(h6.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  const s=d===0?0:d/(1-Math.abs(2*l-1));
  let h=0;
  if(d!==0){
    if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return [Math.round(h),Math.round(s*100),Math.round(l*100)];
}
function hslToRgbStr(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)].join(',');
}
function applyTheme(){
  const rs=document.documentElement.style;
  const th=state.settings.theme;
  rs.setProperty('--primary',th);
  rs.setProperty('--primary-soft',hexToRgba(th,0.14));
  rs.setProperty('--primary-faint',hexToRgba(th,0.07));
  rs.setProperty('--plum-skin',th);
  rs.setProperty('--plum-skin-light',hexToRgba(th,0.22));
  rs.setProperty('--primary-glow',hexToRgba(th,0.5));

  // 회색 계열(글자·선·배경)도 테마 색조를 따라가게 — 무채색에 가까운 테마는 은은하게
  const [h,s,l]=hexToHsl(th);
  const f=Math.min(1,Math.max(0.45,s/50));
  const n=(sat,light)=>`hsl(${h},${Math.round(sat*f)}%,${light}%)`;
  rs.setProperty('--text',n(16,33));
  rs.setProperty('--text-sub',n(12,63));
  rs.setProperty('--faint',n(18,80));
  rs.setProperty('--line',n(28,94));
  rs.setProperty('--line-strong',n(26,87));
  rs.setProperty('--line-faint',n(30,96));
  rs.setProperty('--halfline',n(24,92));
  rs.setProperty('--hover',n(30,97.5));
  rs.setProperty('--switch-off',n(20,90));
  rs.setProperty('--bg',n(30,99));
  rs.setProperty('--nav-bg',n(30,98));
  rs.setProperty('--outer-bg',n(22,93));
  rs.setProperty('--text-rgb',hslToRgbStr(h,Math.round(16*f),33));
  // 토요일 색: 테마색 (밝은 테마도 글자로 읽히도록 명도만 제한)
  rs.setProperty('--sat',`hsl(${h},${Math.min(90,Math.max(40,s))}%,${Math.min(l,68)}%)`);
  const meta=document.getElementById('metaThemeColor');
  if(meta) meta.setAttribute('content',`hsl(${h},${Math.round(30*f)}%,99%)`);

  rs.setProperty('--app-zoom',(state.settings.fontSize||100)/100);
  rs.setProperty('--month-zoom',(state.settings.monthFontScale||100)/100);
}
let _notifTimers=[];
/* '자동이월' 켜진 작업 중 날짜가 지났는데 아직 미완료인 걸 오늘로 옮김 */
function runAutoCarryOver(){
  const today=todayStr();
  let moved=0;
  topTasks().forEach(t=>{
    if(t.autoCarryOver && t.date && t.date<today && !isChecked(t)){
      t.date=today;
      t.order=state.tasks.length;
      moved++;
    }
  });
  if(moved) saveTasks();
  return moved;
}
let _missedNotices=[];
/* sinceMs~nowMs 사이에 울렸어야 했는데(앱이 꺼져있어서) 못 울린 알림들을 찾아냄 */
function computeMissedReminders(sinceMs,nowMs){
  const missed=[];
  if(!sinceMs || nowMs-sinceMs<=0) return missed;
  if(nowMs-sinceMs>7*24*3600*1000) return missed; // 7일 넘게 비웠으면 의미 없어서 스킵
  let cursor=new Date(sinceMs); cursor.setHours(0,0,0,0);
  const endDay=new Date(nowMs); endDay.setHours(0,0,0,0);
  let guard=0;
  while(cursor.getTime()<=endDay.getTime() && guard<8){
    guard++;
    const y=cursor.getFullYear(), m=cursor.getMonth(), d=cursor.getDate();
    const ds=dstr(cursor);
    if(state.settings.dailySummaryEnabled && state.settings.notifyEnabled){
      const parts=(state.settings.dailySummaryTime||'08:00').split(':').map(Number);
      const target=new Date(y,m,d,parts[0]||8,parts[1]||0,0,0).getTime();
      if(target>sinceMs && target<=nowMs){
        missed.push({type:'summary',title:'오늘 하루 요약',at:target});
      }
    }
    if(state.settings.notifyEnabled){
      topTasks().filter(t=>t.date===ds && t.startTime && !isChecked(t) && t.reminder!=='off').forEach(t=>{
        const leadMin=t.reminder!==undefined? +t.reminder : (state.settings.defaultReminder||0);
        const mins=timeToMin(t.startTime);
        const target=new Date(y,m,d,Math.floor(mins/60),mins%60,0,0).getTime();
        const fireAt=target-leadMin*60000;
        if(fireAt>sinceMs && fireAt<=nowMs){
          missed.push({type:'task',id:t.id,title:t.title,at:fireAt});
        }
      });
    }
    cursor=addDays(cursor,1);
  }
  return missed.sort((a,b)=>b.at-a.at);
}
function checkMissedOnResume(){
  runAutoCarryOver();
  const now=Date.now();
  const last=state.settings._lastActiveAt;
  if(last && now-last>90000){
    const missed=computeMissedReminders(last,now);
    if(missed.length){ _missedNotices=missed; renderMissedBar(); }
  }
  state.settings._lastActiveAt=now;
  saveSettings();
}
function renderMissedBar(){
  const el=document.getElementById('missedbar');
  if(!el) return;
  if(!_missedNotices.length){ el.hidden=true; el.innerHTML=''; return; }
  const latest=_missedNotices[0];
  const minsAgo=Math.max(1,Math.round((Date.now()-latest.at)/60000));
  const timeLabel= minsAgo<60? `${minsAgo}분 전` : `${Math.round(minsAgo/60)}시간 전`;
  const extra=_missedNotices.length>1? ` 외 ${_missedNotices.length-1}건`:'';
  el.hidden=false;
  el.innerHTML=`<span class="ic">${BELL_SVG}</span><span class="tx">${timeLabel} 지나간 "${esc(latest.title)}" 알림이 있어요${extra}</span><button class="x" data-act="missedbar-close" aria-label="닫기">${X_SVG}</button>`;
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') checkMissedOnResume();
  else { state.settings._lastActiveAt=Date.now(); saveSettings(); }
});
setInterval(()=>{ if(document.visibilityState==='visible'){ state.settings._lastActiveAt=Date.now(); saveSettings(); } },20000);
function checkDailySummary(){
  if(!state.settings.dailySummaryEnabled) return;
  if(!state.settings.notifyEnabled) return;
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const today=todayStr();
  if(state.settings._lastSummaryDate===today) return;
  const now=new Date();
  const parts=(state.settings.dailySummaryTime||'08:00').split(':').map(Number);
  const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parts[0]||8,parts[1]||0,0,0);
  if(now.getTime()<target.getTime()) return;
  const cnt=topTasks().filter(t=>t.date===today && !isChecked(t)).length;
  try{
    new Notification('오늘 하루 요약',{body:cnt>0?`오늘 할 일 ${cnt}개 있어요. 화이팅!`:'오늘은 예정된 할 일이 없어요.',tag:'planner-daily-summary'});
  }catch(e){}
  state.settings._lastSummaryDate=today;
  saveSettings();
}
setInterval(checkDailySummary,30000);
function scheduleNotifications(){
  checkDailySummary();
  _notifTimers.forEach(id=>clearTimeout(id));
  _notifTimers=[];
  if(!state.settings.notifyEnabled) return;
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const today=todayStr();
  const now=new Date();
  state.tasks.filter(t=>t.parentId===null && t.date===today && t.startTime && !isChecked(t) && t.reminder!=='off').forEach(t=>{
    const leadMin= t.reminder!==undefined? +t.reminder : (state.settings.defaultReminder||0);
    const lead=leadMin*60000;
    const mins=timeToMin(t.startTime);
    const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(mins/60),mins%60,0,0);
    const fireAt=target.getTime()-lead;
    const delay=fireAt-now.getTime();
    if(delay>500 && delay<24*3600*1000){
      const id=setTimeout(()=>{
        try{
          new Notification(t.title,{
            body: leadMin>0 ? `${leadMin}분 후 시작이에요` : '지금 시작할 시간이에요',
            tag:'planner-task-'+t.id
          });
        }catch(e){}
      },delay);
      _notifTimers.push(id);
    }
  });
}

function render(){
  saveSettings();
  saveCategories();
  saveTasks();
  saveSleep();
  saveWork();
  try{ sessionStorage.setItem('jado_lastTab', state.ui.tab); }catch(e){}
  scheduleNotifications();
  applyTheme();
  renderTopbar();
  renderNav();
  if(state.ui.tab==='daily') renderDaily();
  else if(state.ui.tab==='week') renderWeek();
  else if(state.ui.tab==='month') renderMonth();
  else if(state.ui.tab==='dump') renderDump();
  else if(state.ui.tab==='work') renderWork();
  else renderSettings();
  renderExecBar();
  renderMissedBar();
  if(document.getElementById('wkCalOverlay')) renderWeekCalGrid();
}
document.getElementById('overlay').addEventListener('click',()=>{
  closeModal(); closeSheet();
});
document.getElementById('bottomnav').addEventListener('click',(e)=>{
  const b=e.target.closest('button[data-tab]');
  if(b){
    closePopovers();
    if(b.dataset.tab==='more'){ openMoreSheet(); return; }
    if(b.dataset.tab==='daily') state.ui.dailyDate=todayStr();
    state.ui.tab=b.dataset.tab; state.ui.weekDraft=null; render();
  }
});

setInterval(()=>{ if(state.ui.tab==='daily') renderDaily(); },30000);

let _lastKnownToday=todayStr();
dedupeRepeatInstances();
regenerateAllRepeats();
setInterval(()=>{
  const nowStr=todayStr();
  if(nowStr!==_lastKnownToday){
    if(state.ui.dailyDate===_lastKnownToday) state.ui.dailyDate=nowStr;
    state.ui.weekCursor=startOfWeek(new Date(),state.settings.weekStartsMonday);
    state.ui.ttCursor=startOfWeek(new Date(),state.settings.weekStartsMonday);
    _lastKnownToday=nowStr;
    dedupeRepeatInstances();
    regenerateAllRepeats();
    runAutoCarryOver();
    render();
  }
},30000);


checkMissedOnResume();
render();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(()=>{});
    let refreshed=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshed) return;
      refreshed=true;
      window.location.reload();
    });
  });
}
</script>
