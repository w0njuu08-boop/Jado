<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#FDFCFB" id="metaThemeColor">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jado</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jado">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFCFB;
  --surface:#FFFFFF;
  --text:#4B4A63;
  --text-sub:#9B98AC;
  --line:#EEEBF4;
  --line-strong:#D9D6E6;
  --primary:#7FA8E8;
  --primary-soft:#EAF1FC;
  --danger:#E27D8E;
  --nav-h:78px;
  --c1:#FEB6C7; --c2:#FFECC1; --c3:#97C0F7; --c4:#B3A0E9; --c5:#8DD0C2; --c6:#A7A9B9; --c7:#91B199;
  --font: -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  --faint:#C7C4D6; --plum-skin:#9B87C4; --plum-skin-light:#E7E0F5; --leafgreen:#7BAE8C; --peach:#F0A98E;
  --line-faint:#F3F1F8; --primary-faint:#F5F0FC;
  --halfline:#E9E6F1; --hover:#F7F6FB; --switch-off:#E3E1EC; --nav-bg:#FAF9FC; --outer-bg:#ECEAF2; --sat:#8FB3EA; --text-rgb:75,74,99;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--outer-bg);}
html{accent-color:var(--primary);caret-color:var(--primary);}
::selection{background:var(--primary-soft);}
body{
  font-family:var(--font);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  display:flex;justify-content:center;
}
#shell{
  width:100%;max-width:430px;min-height:100vh;background:var(--bg);
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,0.08);
}
#topbar{
  padding:16px 20px 0;
}
#topbar .date{font-size:12.5px;color:var(--text-sub);font-weight:500;}
#topbar h1{font-family:'Archivo Black',var(--font);font-size:26px;margin:3px 0 6px;letter-spacing:0.3px;font-weight:400;line-height:1.15;color:var(--primary);}
#topbar .sub{font-size:13.5px;color:var(--primary);font-weight:500;}
#topbar .topbar-divider{height:2px;background:var(--primary);margin:12px 0;}

main{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 10px);-webkit-overflow-scrolling:touch;zoom:var(--app-zoom,1);}
main::-webkit-scrollbar{display:none;}

/* ---------- bottom nav ---------- */
#bottomnav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;
  height:var(--nav-h);background:var(--nav-bg);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40;
}
#bottomnav button{
  flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-sub);font-family:var(--font);cursor:pointer;font-size:11px;
}
#bottomnav button.active{color:var(--text);font-weight:700;}
#bottomnav button .ic{font-size:21px;}
#bottomnav button .ic svg{width:21px;height:21px;display:block;margin:0 auto;}
#bottomnav button[hidden]{display:none;}

/* ---------- generic ---------- */
.pillrow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
.pillrow::-webkit-scrollbar{display:none;}
.pill{
  flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:12.5px;border:1.3px solid var(--line-strong);
  background:transparent;color:var(--text-sub);white-space:nowrap;cursor:pointer;font-family:var(--font);
}
.pill.active{color:var(--text);font-weight:700;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}

.fab{
  position:fixed;left:50%;transform:translateX(calc(-50% + 155px));bottom:calc(var(--nav-h) + 16px);
  width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;
  font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(var(--text-rgb,75,74,99),0.35);
  cursor:pointer;z-index:30;
}

/* ---------- WORK ---------- */
.wrk-card{margin:2px 20px 14px;border:1px solid var(--line);border-radius:22px;padding:14px 8px 10px;background:var(--surface);position:relative;}
.wrk-nav{display:flex;align-items:center;justify-content:center;gap:30px;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--text);}
.wrk-nav button{border:none;background:none;color:var(--text-sub);font-size:22px;line-height:1;cursor:pointer;padding:0 10px;font-family:var(--font);}
.wrk-nav span{cursor:pointer;min-width:96px;text-align:center;}
.wrk-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-sub);margin-bottom:4px;}
.wrk-dow .sun{color:var(--danger);}
.wrk-dow .holi{color:var(--danger);}
.wrk-dow .sat{color:var(--sat);}
.wrk-week{display:grid;grid-template-columns:repeat(7,1fr);column-gap:2px;margin-bottom:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
.wrk-d{text-align:center;font-size:15px;font-weight:500;padding:7px 0;border-radius:10px;cursor:pointer;color:var(--text);}
.wrk-d.sun{color:var(--danger);}
.wrk-d.holi{color:var(--danger);}
.wrk-d.sat{color:var(--sat);}
.wrk-d.today{font-weight:800;}
.wrk-d.sel{background:var(--primary);color:#fff;}
.wrk-d.rng,.wrk-c.rng{background:var(--primary-soft);}
.wrk-c{min-height:var(--cellh,38px);padding:3px 3px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;position:relative;}
.wrk-c.sel{background:var(--line-faint);}
.wrk-chip{display:flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wrk-chip i{width:6px;height:6px;border-radius:2px;flex-shrink:0;display:block;}
.wrk-chip.done{text-decoration:line-through;color:var(--faint);}
.wrk-more1{font-size:9px;color:var(--text-sub);}
.wrk-bar{height:16px;margin:1px 0;font-size:10.5px;font-weight:700;color:var(--text);padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2;position:relative;}
.wrk-bar-handle{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;z-index:3;}
.wrk-bar-handle.l{left:0;}
.wrk-bar-handle.r{right:0;}
.wrk-puller{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 0;cursor:pointer;}
.wrk-puller i{width:44px;height:5px;border-radius:3px;background:var(--line-strong);display:block;}
.wrk-puller span{font-size:11px;color:var(--text-sub);}
.wrk-seg{display:flex;margin:0 20px 14px;padding:5px;background:var(--line-faint);border-radius:999px;}
.wrk-seg button{flex:1;border:none;background:none;padding:11px 0;border-radius:999px;font-size:14px;color:var(--text-sub);cursor:pointer;font-family:var(--font);font-weight:600;}
.wrk-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 6px rgba(var(--text-rgb,75,74,99),0.12);}
.wrk-body{padding:0 20px 24px;}
.wrk-empty{text-align:center;color:var(--text-sub);font-size:13.5px;padding:26px 0;}
.wrk-grp{border-left:4px solid var(--pc);padding:2px 0 4px 14px;margin:0 0 14px;}
.wrk-gh{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;padding:6px 0;cursor:pointer;color:var(--text);}
.wrk-gh .cnt{font-size:13px;font-weight:600;color:var(--text-sub);}
.wrk-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.wrk-chk{border:none;background:none;padding:0;cursor:pointer;display:flex;flex-shrink:0;}
.wrk-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;margin:0 6px 0 3px;}
.wrk-ttl{flex:1;min-width:0;font-size:15px;font-weight:600;cursor:pointer;color:var(--text);word-break:break-word;}
.wrk-ttl small{font-size:11px;font-weight:600;color:var(--text-sub);margin-right:6px;}
.wrk-row.done .wrk-ttl{color:var(--faint);text-decoration:line-through;font-weight:500;}
.wrk-more{border:none;background:none;color:var(--faint);font-size:18px;padding:2px 6px;cursor:pointer;font-family:var(--font);}
.wrk-go{border:none;background:none;color:var(--text-sub);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap;}
.wrk-addin{border:none;background:none;color:var(--text-sub);font-size:13px;padding:6px 0 4px;cursor:pointer;font-family:var(--font);}
.wrk-quick{display:flex;align-items:center;gap:10px;margin:8px 0 6px;}
.wrk-quick .box{flex:1;display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line-strong);border-radius:18px;padding:0 14px;height:52px;background:var(--line-faint);}
.wrk-quick.memo .box{border-style:solid;background:var(--surface);}
.wrk-quick input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14.5px;font-family:var(--font);color:var(--text);}
.wrk-quick input::placeholder{color:var(--text-sub);}
.wrk-fab{width:52px;height:52px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font);}
.wrk-undh{width:100%;display:flex;align-items:center;gap:6px;border:none;background:none;padding:12px 2px;font-size:15px;font-weight:800;color:var(--text);cursor:pointer;font-family:var(--font);}
.wrk-undh .n{font-weight:500;color:var(--text-sub);font-size:13px;}
.wrk-undh .arr{margin-left:auto;color:var(--text-sub);font-size:11px;}
.wrk-memo{display:flex;align-items:center;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);}
.wrk-memo .tx{flex:1;min-width:0;font-size:15px;font-weight:700;word-break:break-word;color:var(--text);}
.wrk-memo .go{border:none;background:none;color:var(--text-sub);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap;}
.wrk-memo .x{border:none;background:none;color:var(--faint);font-size:16px;cursor:pointer;font-family:var(--font);}
.wrk-untimed{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line-strong);display:flex;flex-direction:column;gap:5px;}
.wrk-untimed .lb{font-size:11px;color:var(--text-sub);margin-bottom:2px;}
.wrk-hr{display:flex;gap:10px;min-height:36px;border-top:1px solid var(--line);padding:6px 0;}
.wrk-hr .lb{width:40px;flex-shrink:0;font-size:11px;color:var(--text-sub);padding-top:2px;}
.wrk-hr .cn{flex:1;display:flex;flex-direction:column;gap:4px;}
.wrk-tb{border-left:3px solid var(--pc);background:var(--pcbg);border-radius:6px;padding:6px 9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);}
.wrk-tb small{color:var(--text-sub);font-weight:500;margin-right:6px;font-size:11px;}
.wrk-tb.done{text-decoration:line-through;color:var(--faint);}
.wrk-menu{position:fixed;min-width:190px;}
.wrk-menu .sec{font-size:11px;color:var(--text-sub);padding:10px 14px 4px;}
.wrk-menu .hr{height:1px;background:var(--line);margin:4px 0;}
.wrk-menu .it .swatch{width:14px;height:14px;border-radius:5px;display:inline-block;flex-shrink:0;}
.wrk-swrow{display:flex;flex-wrap:wrap;gap:8px;}
.wrk-sw{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;box-sizing:border-box;}
.wrk-sw.sel{border-color:var(--text);}
.wrk-qd{display:flex;gap:8px;margin-bottom:10px;}
.wrk-qd button{flex:1;padding:10px 0;border-radius:999px;border:1.5px solid var(--line-strong);background:none;font-size:13px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.wrk-qd button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--text);font-weight:700;}

.wrk-hint{text-align:center;font-size:11.5px;color:var(--text-sub);padding:8px 0 2px;}
.wrk-gh .nm{display:flex;align-items:center;gap:8px;}
.wrk-gh .dd{font-style:normal;font-size:11px;font-weight:700;color:var(--pc);background:var(--primary-faint);border-radius:999px;padding:2px 8px;}
.wrk-mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
.wrk-mchips::-webkit-scrollbar{display:none;}
.wrk-mchip{flex-shrink:0;border:1.5px solid var(--line-strong);background:none;border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.wrk-mchip.on{background:var(--line-faint);color:var(--text);font-weight:700;}
.wrk-mgrp{border-left:4px solid var(--pc);padding-left:12px;margin-top:14px;}
.wrk-mgh{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;color:var(--text);padding:4px 0;}
.wrk-mgh span{font-weight:500;color:var(--text-sub);font-size:12px;}
.wrk-body .timetable-wrap{padding:4px 0 30px;}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:6px;}
.more-grid button{border:none;background:var(--line-faint);border-radius:16px;padding:16px 0 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--text);font-family:var(--font);}
.more-grid button span{font-size:12.5px;font-weight:600;}
.wrk-set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.wrk-set.col{flex-direction:column;align-items:stretch;gap:8px;}
.wrk-set .lab{font-size:13.5px;color:var(--text);font-weight:600;}
.wrk-set .lab b{font-weight:500;color:var(--text-sub);margin-left:6px;font-size:12px;}
.wrk-set input[type=range]{width:100%;}
.wrk-segb{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;}
.wrk-segb button{border:none;background:none;padding:6px 13px;font-size:12.5px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.wrk-segb button.on{background:var(--primary);color:#fff;}
.wrk-days{display:flex;gap:5px;}
.wrk-days button{flex:1;padding:8px 0;border-radius:8px;border:1.5px solid var(--line-strong);background:none;font-size:12.5px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.wrk-days button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.wrk-tr{display:flex;align-items:center;gap:6px;}
.wrk-tr select{border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);}
.np-rows{display:flex;flex-direction:column;gap:6px;}
.np-row{border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface);}
.np-main{display:flex;align-items:center;gap:6px;}
.np-date{width:44px;flex-shrink:0;font-size:13px;font-weight:700;color:var(--text);}
.np-date small{display:block;font-size:10px;font-weight:500;color:var(--text-sub);}
.np-text{flex:1;min-width:0;border:none;background:var(--line-faint);border-radius:8px;padding:8px 10px;font-size:14px;font-family:var(--font);outline:none;color:var(--text);}
.np-btn{flex-shrink:0;min-width:32px;height:32px;border:1px solid var(--line-strong);background:none;border-radius:8px;color:var(--text-sub);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;font-family:var(--font);padding:0 6px;}
.np-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--text);}
.np-btn b{font-size:10px;font-weight:700;}
.np-time{margin-top:8px;padding:10px;background:var(--line-faint);border-radius:10px;display:flex;flex-direction:column;gap:8px;}
.np-seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;width:fit-content;}
.np-seg button{border:none;background:none;padding:6px 16px;font-size:12.5px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.np-seg button.on{background:var(--primary);color:#fff;}
.np-tt{display:flex;gap:8px;}
.np-tt input,.np-tt select{flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:8px;font-size:13.5px;font-family:var(--font);color:var(--text);background:var(--surface);min-width:0;}
.np-sum{font-size:12px;color:var(--text-sub);}
.np-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);}
.wk2-worksec{margin:14px 20px 0;padding-top:10px;border-top:1px dashed var(--line-strong);}
.wk2-worksec .h{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:4px;}
.wk2-worksec .r{display:flex;align-items:center;gap:8px;padding:5px 0;}
.wk2-worksec .c{border:none;background:none;padding:0;display:flex;cursor:pointer;}
.wk2-worksec .tt{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;}
.wk2-worksec .tt small{font-size:10.5px;color:var(--text-sub);margin-right:5px;font-weight:600;}
.wk2-worksec .r.done .tt{color:var(--faint);text-decoration:line-through;}
.wk2-worksec .pn{font-size:11px;font-weight:600;flex-shrink:0;}

.wrk-body.tt{padding:0;}
.wrk-body.tt .timetable-wrap{padding:12px 10px 40px;}
.wrk-nav button.dis{opacity:.25;cursor:default;pointer-events:none;}
.modalbox.pe{width:92%;max-width:400px;padding:20px 16px 16px;border-radius:26px;}
.pe-title{text-align:center;font-size:16px;margin:0 0 6px;}
.pe-range{text-align:center;font-size:13px;color:var(--text-sub);padding:4px 0 10px;cursor:pointer;}
.pe-dates{margin:0 0 10px;}
.pe-dates input{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:8px;font-size:13px;font-family:var(--font);color:var(--text);}
.pe-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 2px 4px;}
.pe-name{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:18px;padding:16px 18px;font-size:15px;font-family:var(--font);outline:none;color:var(--text);background:var(--surface);}
.pe-name:focus{border-color:var(--primary);}
.pe-hint{font-size:11.5px;color:var(--text-sub);margin:16px 0 8px;}
.pe-rows{display:flex;flex-direction:column;gap:8px;}
.pe-line{display:flex;align-items:center;gap:8px;}
.pe-date{width:42px;flex-shrink:0;font-size:13px;color:var(--text-sub);}
.pe-pill{flex:1;min-width:0;min-height:46px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:16px;padding:6px 10px;background:var(--surface);cursor:text;}
.pe-chips{display:contents;}
.pe-chip{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:13px;color:var(--text);}
.pe-chip button{border:none;background:none;color:var(--danger);font-size:12px;padding:0 4px;cursor:pointer;opacity:.75;}
.pe-in{flex:1;min-width:60px;border:none;outline:none;background:transparent;font-size:14px;font-family:var(--font);color:var(--text);padding:4px 0;}
.pe-btn{flex-shrink:0;width:38px;height:38px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:1px;padding:0;font-family:var(--font);}
.pe-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--text);}
.pe-btn b{font-size:10px;font-weight:700;}
.pe-row .np-time{margin:6px 0 2px 50px;}
.pe-colors{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 0;justify-items:center;padding:22px 0 12px;}
.pe-sw{width:30px;height:30px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line);box-sizing:border-box;}
.pe-sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--text);}
.modalbox.pe .modalfooter{margin-top:8px;}
.modalbox.pe .modalfooter button{border-radius:14px;padding:15px 0;font-size:14px;}
.modalbox.pe .modalfooter .cancel{flex:0 0 26%;}
.modalbox.pe .modalfooter .pe-del{flex:0 0 18%;background:var(--line-faint);color:var(--danger);}

/* ---------- 실행 중 작업 고정 바 ---------- */
.execbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 8px);
  width:calc(100% - 24px);max-width:406px;height:42px;z-index:35;
  display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
  box-shadow:0 6px 18px rgba(var(--text-rgb,75,74,99),0.16);
}
.execbar[hidden]{display:none;}
.execbar .pulse{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;animation:execpulse 1.6s ease-in-out infinite;}
@keyframes execpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
.execbar .ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.execbar .more{flex-shrink:0;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:2px 7px;}
.execbar .tm{flex-shrink:0;font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.2px;}
.execbar .stop{flex-shrink:0;width:30px;height:30px;border:none;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.execbar .stop svg{width:11px;height:11px;}
body.has-execbar main{padding-bottom:calc(var(--nav-h) + 10px + 54px);}
body.has-execbar .fab{bottom:calc(var(--nav-h) + 16px + 54px);}

/* ---------- 놓친 알림 배너 ---------- */
.missedbar{

}

.wk2-draft .wk2-act.off,.wk2-draft .wk2-addchild.off{opacity:.45;pointer-events:none;}
.wk2-empty{text-align:center;color:var(--text-sub);font-size:13px;padding:30px 20px;}

.tasklist{margin:0 20px;}
.seprow{display:flex;align-items:center;margin:2px 0;}
.seprow .line{flex:1;border-top:1px dashed var(--line-strong);}
.seprow .plusbtn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--text-sub);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 4px;flex:0 0 auto;}

.taskrow{display:flex;align-items:flex-start;gap:8px;padding:9px 0 3px;border-left:2px solid transparent;}
.taskrow.child{margin-left:32px;border-left:1.5px solid var(--line-strong);padding-left:10px;}
.taskrow .handle{color:var(--line-strong);font-size:11px;padding-top:3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.checkc{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--line-strong);flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;}
.checkc.done{background:var(--primary);border-color:var(--primary);}
.taskbody{flex:1;min-width:0;}
.taskbody .titlerow{display:flex;align-items:center;gap:5px;}
.taskbody .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.taskbody .title.done{color:var(--text-sub);text-decoration:line-through;}
.taskbody .frac{font-size:11px;color:var(--text-sub);flex:0 0 auto;}
.addchild{font-size:11.5px;color:var(--text-sub);margin:2px 0 6px 32px;cursor:pointer;display:inline-block;}
.taskacts{display:flex;gap:9px;align-items:center;flex:0 0 auto;padding-top:1px;}
.taskacts span{font-size:13px;color:var(--faint);cursor:pointer;}
.taskacts span.hl{color:var(--primary);}

.inlineadd{display:flex;gap:6px;margin:6px 0;}
.inlineadd input{flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:var(--font);outline:none;}
.inlineadd.minimal{margin:2px 0 2px 22px;}
.inlineadd.minimal input{border:none;border-bottom:1px dashed var(--line-strong);border-radius:0;background:none;padding:3px 2px;font-size:12.5px;color:var(--text);}
.inlineadd button{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:0 12px;font-size:12.5px;cursor:pointer;}
.inlineadd button.cancel{background:none;color:var(--text-sub);}

.doneArea{margin:18px 20px 30px;border-top:1px solid var(--line);padding-top:8px;}
.doneArea .head{font-size:12.5px;color:var(--text-sub);cursor:pointer;display:flex;justify-content:space-between;}
.doneArea .list{margin-top:6px;}
.doneArea .row{display:flex;align-items:center;gap:8px;padding:6px 0;opacity:0.7;}
.doneArea .row .title{flex:1;font-size:13px;text-decoration:line-through;color:var(--text-sub);}
.doneArea .row span{font-size:13px;color:var(--faint);cursor:pointer;}

.wk2-donecard{margin:14px 20px 30px;background:var(--primary-faint);border-radius:16px;padding:14px 16px;}
.wk2-donerow{display:flex;align-items:center;gap:10px;padding:8px 0;}
.wk2-donerow .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex-shrink:0;}
.wk2-donerow .title{flex:1;font-size:14px;text-decoration:line-through;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.wk2-donerow .act{font-size:14px;color:var(--faint);cursor:pointer;flex-shrink:0;width:22px;text-align:center;}
.wk2-donehint{text-align:center;color:var(--text-sub);font-size:13px;padding:10px 0;}

.dropdown{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(var(--text-rgb,75,74,99),0.18);z-index:60;min-width:150px;overflow:hidden;}
.dropdown .it{padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;}
.dropdown .it:hover{background:var(--hover);}
.dropdown .it.danger{color:var(--danger);}
.dropdown .it.active{color:var(--primary);font-weight:700;}
.dropdown .swatch{display:inline-block;width:18px;height:18px;border-radius:6px;flex-shrink:0;}

/* ---------- MONTH ---------- */
#topbar{position:relative;}
.topbar-icons{display:flex;gap:16px;align-items:center;position:absolute;right:20px;top:15px;color:var(--text-sub);}
.topbar-icons .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.topbar-icons .ic svg{width:20px;height:20px;display:block;}
.monthbar{display:flex;align-items:center;gap:10px;padding:4px 20px 14px;}
.monthbar h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-0.3px;}
.monthbar .navbtn{background:none;border:none;font-size:18px;color:var(--text-sub);cursor:pointer;padding:2px 5px;}
.monthbar .chip{font-size:11.5px;border:1.3px solid var(--line-strong);border-radius:20px;padding:5px 12px;background:none;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.monthbar .spacer{flex:1;}
.monthbar .gearbtn{width:28px;height:28px;border-radius:50%;background:var(--line-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-sub);flex-shrink:0;}
.monthbar .gearbtn svg{width:15px;height:15px;}
.mcatrow{display:flex;align-items:center;padding:2px 20px 14px;gap:7px;}
.mcatrow .pillrow{flex:1;min-width:0;gap:8px;}
.mcatrow .pill{padding:4px 8px;font-size:11px;font-weight:600;border-radius:999px;border-width:1.4px;}
.catfilterrow .pill{padding:4px 8px;font-size:11px;font-weight:600;border-radius:999px;border-width:1.4px;}
.dumpcatrow .pill{padding:4px 8px;font-size:11px;font-weight:600;border-radius:999px;border-width:1.4px;}
.mcatrow .pill.active{background:var(--line-faint);border-color:var(--line-strong);color:var(--text);}
.mcatrow .ic,.catfilterrow .ic,.dumpcatrow .ic{font-size:15px;cursor:pointer;flex-shrink:0;padding:4px;color:var(--text-sub);}
.calgrid{margin:0 14px;zoom:var(--month-zoom,1);}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13.5px;font-weight:700;color:var(--text);padding:4px 0 12px;}
.calrows{display:grid;grid-template-columns:repeat(7,1fr);}
.calcell{height:calc(88px * var(--row-scale,1));overflow:hidden;padding:7px 3px 4px;position:relative;cursor:pointer;border-radius:7px;text-align:center;}
.calcell.other{opacity:0.4;}
.calcell.past{opacity:0.55;}
.calcell.selected{background:var(--primary-faint);box-shadow:0 0 0 1.3px var(--line-strong) inset;}
.calcell .dnum{font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:var(--text);margin-bottom:3px;}
.calcell.today .dnum{background:var(--primary);color:#fff;font-weight:700;}
.calcell .dnum.sun{color:#E893A0;}
.calcell .dnum.holi{color:var(--danger);}
.calcell .holiname{font-size:8.5px;font-weight:700;color:var(--danger);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.calcell .dnum.sat{color:var(--sat);}
.calcell.past .dnum.sun,.calcell.past .dnum.sat,.calcell.past .dnum{color:var(--text-sub);}
.calcell .ev{font-size:9.5px;line-height:1.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:3px;color:var(--text-sub);}
.calcell .ev .b{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.calcell .evdots{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;}
.calcell .evdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.calcell .wproj{display:flex;flex-direction:column;gap:1px;margin-bottom:1px;}
.calcell .wproj-chip{display:block;font-size:8.5px;font-weight:700;line-height:1.5;border-radius:4px;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.calcell .more{font-size:9.5px;color:var(--text-sub);margin-top:1px;text-align:left;}
.daydetail{margin:22px 20px 30px;}
.daydetail .puller{width:36px;height:24px;padding:10px 0;border-radius:3px;margin:0 auto 8px;cursor:ns-resize;background-clip:content-box;background-color:var(--line-strong);touch-action:none;display:flex;}
.daydetail .h{display:flex;justify-content:space-between;align-items:center;font-size:15.5px;font-weight:800;margin-bottom:10px;}
.daydetail .h a{color:var(--text-sub);cursor:pointer;font-size:12px;font-weight:600;}
.mblock{border-top:1px solid var(--line-faint);padding:12px 0;}
.mblock:first-of-type{border-top:none;padding-top:0;}
.mrow{display:flex;align-items:center;gap:10px;padding:3px 0;}
.mrow .handle{color:var(--faint);font-size:13px;cursor:grab;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.wk2-block.dragging,.mblock.dragging{opacity:0.5;}
.msq{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--primary);background:transparent;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;padding:0;font-family:var(--font);}
.msq.on{background:var(--primary);border-color:var(--primary);}
.mparentmark{width:10px;height:10px;border-radius:3px;background:var(--primary);flex-shrink:0;cursor:pointer;padding:0;border:none;}
.mrow .title{flex:1;font-size:14px;font-weight:700;}
.mrow .title.done{color:var(--faint);text-decoration:line-through;font-weight:600;}
.mrow.sub{padding:2px 0 2px 30px;}
.mrow.sub .title{font-size:12.5px;font-weight:500;}
.mrow.sub .title.done{color:var(--faint);text-decoration:line-through;font-weight:500;}
.mquickadd{margin-top:6px;border:1.6px dashed var(--line-strong);border-radius:14px;padding:12px 16px;}
.mquickadd input{border:none;background:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text-sub);text-align:center;width:100%;}
.mtt-h{font-size:15.5px;font-weight:800;margin:24px 0 10px;}
.mtt-row{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 14px;margin-bottom:8px;}
.srch-row{display:flex;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.srch-tag{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-faint);border-radius:8px;padding:3px 7px;flex-shrink:0;}
.srch-ttl{flex:1;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srch-sub{font-size:11px;color:var(--text-sub);flex-shrink:0;}
.mtt-row .time{font-size:12.5px;color:var(--text-sub);font-weight:600;width:38px;flex-shrink:0;}
.mtt-row .emoji{font-size:15px;flex:1;}
.mtt-row .del{color:var(--faint);cursor:pointer;font-size:13px;flex-shrink:0;display:flex;}
.mtt-row .del svg{width:13px;height:13px;}

.popover{position:absolute;right:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(var(--text-rgb,75,74,99),0.2);padding:14px;z-index:70;width:230px;font-size:12.5px;}
.popover .prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.popover .seg{display:flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;}
.popover .seg button{border:none;background:none;padding:4px 8px;font-size:11.5px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.popover .seg button.on{background:var(--primary);color:#fff;}
.switch{width:34px;height:19px;border-radius:999px;background:var(--switch-off);position:relative;cursor:pointer;flex:0 0 auto;}
.switch.on{background:var(--primary);}
.switch i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on i{left:17px;}

/* ---------- DUMP ---------- */
.dumpinputrow{display:flex;align-items:center;gap:10px;margin:14px 20px 12px;}
.dumpinput{flex:1;border:1px solid var(--line-strong);border-radius:20px;padding:14px 18px;display:flex;align-items:center;}
.dumpinput input{flex:1;border:none;outline:none;font-size:14px;font-family:var(--font);background:none;color:var(--text);}
.dumpinput input::placeholder{color:var(--faint);}
.dumpaddbtn{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.dumpcatrow{display:flex;align-items:center;padding:2px 20px 10px;gap:7px;}
.dumpcount{display:flex;justify-content:space-between;align-items:center;margin:0 20px 4px;font-size:11.5px;color:var(--text-sub);}
.dumpcount .right{display:flex;align-items:center;gap:12px;}
.dumpcount .sortlabel{cursor:pointer;display:flex;align-items:center;gap:3px;}
.dumprow{display:flex;align-items:center;gap:7px;padding:10px 0 10px 10px;border-top:1px solid var(--line-faint);border-left:2px solid var(--line-strong);margin:0 20px;}
.dumprow .title{flex:1;font-size:14px;}
.dumprow .title.done{text-decoration:line-through;color:var(--text-sub);}
.dumprow .rowact{width:13px;height:13px;border:none;background:transparent;color:var(--faint);padding:0;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-family:var(--font);}
.dumprow .rowact svg{width:13px;height:13px;}

/* ---------- SETTINGS ---------- */
.settabs{display:flex;gap:6px;margin:0 20px 14px;}
.settabs button{flex:1;border:none;background:var(--line-faint);color:var(--text-sub);padding:8px 0;border-radius:9px;font-size:12.5px;cursor:pointer;font-family:var(--font);}
.settabs button.on{background:var(--primary);color:#fff;font-weight:700;}
.setgroup{margin:0 20px 22px;}
.setgroup h3{font-size:12.5px;color:var(--text-sub);margin:0 0 8px;}
.swrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:var(--text);}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);}
.setrow:first-child{border-top:none;}
.setrow .lab{font-size:13.5px;display:flex;align-items:center;gap:8px;}
.catedit{display:flex;align-items:center;gap:8px;flex:1;}
.catedit input{border:none;background:none;font-size:14px;font-weight:600;font-family:var(--font);flex:1;outline:none;color:var(--text);min-width:0;}
.catblock{border-top:1px solid var(--line);padding:10px 0;}
.catblock:first-child{border-top:none;}
.catpalette{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap;}
.catswatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex-shrink:0;}
.catswatch.sel{border-color:var(--text);box-shadow:0 0 0 1px var(--surface) inset;}
.catcustom{width:22px;height:22px;border-radius:50%;flex-shrink:0;position:relative;border:1.5px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;overflow:hidden;}
.catcustom input[type=color]{position:absolute;inset:-4px;width:30px;height:30px;border:none;padding:0;background:none;cursor:pointer;opacity:0;}
.cathex{border:1px solid var(--line-strong);border-radius:7px;padding:4px 8px;font-size:12px;font-family:var(--font);width:82px;text-transform:uppercase;outline:none;color:var(--text);margin-left:2px;}
.catorder{display:flex;flex-direction:column;flex-shrink:0;}
.orderbtn{border:none;background:none;color:var(--text-sub);font-size:9px;line-height:1;padding:2px 4px;cursor:pointer;}
.orderbtn:disabled{opacity:0.25;cursor:default;}
.smallbtn{border:1px solid var(--line-strong);background:none;border-radius:7px;padding:5px 9px;font-size:12px;color:var(--text-sub);cursor:pointer;font-family:var(--font);}
.smallbtn.danger{color:var(--danger);border-color:#F3C6CE;}
.hint{font-size:11px;color:var(--text-sub);margin-top:4px;line-height:1.5;}

/* ---------- overlay / modal / sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(var(--text-rgb,30,28,45),0.35);z-index:80;display:none;}
.overlay.show{display:block;}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;
  background:var(--surface);border-radius:24px 24px 0 0;z-index:90;display:none;max-height:78vh;overflow-y:auto;padding:10px 20px 26px;}
.sheet.show{display:block;}
.sheet .handle{width:38px;height:4px;background:var(--line-strong);border-radius:3px;margin:4px auto 14px;}
.sheet h3{font-size:16px;margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--text-sub);display:block;margin-bottom:4px;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select{
  width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:9px 10px;font-size:14px;font-family:var(--font);outline:none;color:var(--text);
}
.field .row2{display:flex;gap:8px;}
.field .row2>div{flex:1;}
.togglerow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
.catpick{display:flex;flex-wrap:wrap;gap:7px;}
.catpick .cchip{padding:6px 12px;border-radius:999px;font-size:12.5px;border:1.5px solid var(--line-strong);cursor:pointer;}
.catpick .cchip.sel{color:#fff;border-color:transparent;}
.primarybtn{width:100%;border:none;background:var(--primary);color:#fff;padding:13px 0;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:6px;font-family:var(--font);}
.wdaychips{display:flex;gap:5px;}
.wdaychips .w{flex:1;text-align:center;padding:8px 0;border-radius:8px;border:1.5px solid var(--line-strong);font-size:12.5px;cursor:pointer;}
.wdaychips .w.sel{background:var(--primary);color:#fff;border-color:var(--primary);}

.modalbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;max-width:340px;
  background:var(--surface);border-radius:16px;z-index:95;display:none;padding:18px;max-height:82vh;flex-direction:column;}
.modalbox.show{display:flex;}
.modalbox h3{font-size:15px;margin:0 0 12px;flex-shrink:0;}
#modalBody{overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ---------- 카테고리 관리 모달 ---------- */

.catmgr-row:first-child{border-top:none;}

.catmgr-palette{margin:0 0 6px 30px;padding:10px 12px;background:var(--bg);border-radius:10px;}
.catmgr-paletteTitle{font-size:10.5px;color:var(--text-sub);text-align:center;margin-bottom:8px;font-style:italic;}
.catmgr-paletteGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;justify-items:center;}
.catmgr-swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.catmgr-swatch.sel{border-color:var(--text);}
.catmgr-customrow{display:flex;align-items:center;gap:8px;margin-top:10px;justify-content:center;}
.catmgr-addrow{display:flex;align-items:center;gap:8px;padding:10px 0 14px;border-top:1px dashed var(--line-strong);margin-top:4px;}
.catmgr-addrow input{flex:1;border:none;background:none;font-size:13.5px;font-family:var(--font);color:var(--text);outline:none;}
.catmgr-add{font-size:12.5px;font-weight:700;color:var(--primary);cursor:pointer;flex-shrink:0;}
.catmgr-done{width:100%;border:1.6px solid var(--danger);color:var(--danger);background:none;border-radius:24px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);}
.modalfooter{display:flex;gap:8px;margin-top:14px;flex-shrink:0;}
.modalfooter button{flex:1;border:none;border-radius:9px;padding:11px 0;font-size:13.5px;cursor:pointer;font-family:var(--font);}
.modalfooter .ok{background:var(--primary);color:#fff;}
.modalfooter .cancel{background:var(--line-faint);color:var(--text-sub);}
.rp-hint{font-size:11.5px;color:var(--text-sub);margin:2px 0 10px;}
.rp-quickrow{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.rp-quickrow .smallbtn{flex:1;text-align:center;padding:8px 0;}
.rp-divider{border-top:1px dashed var(--line-strong);margin:14px 0;}
.rp-section-title{font-size:13px;font-weight:700;margin-bottom:8px;}
.rp-modecard{border:1.5px solid var(--line-strong);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.rp-modecard.sel{border-color:var(--primary);background:var(--primary-soft);}
.rp-modecard .rp-modehead{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.rp-modecard .rp-modedesc{font-size:11.5px;color:var(--text-sub);margin-top:3px;}
.rp-monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.rp-monthgrid .d{text-align:center;padding:7px 0;border-radius:9px;border:1.5px solid var(--line-strong);font-size:12.5px;cursor:pointer;}
.rp-monthgrid .d.sel{background:var(--primary);color:#fff;border-color:var(--primary);}
.rp-steprow{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;}
.rp-steprow .lab{font-size:13.5px;font-weight:600;color:var(--text);}
.rp-stepper{display:flex;align-items:center;gap:14px;}
.rp-stepper .step{width:30px;height:30px;border-radius:50%;border:none;background:var(--primary-faint);color:var(--primary);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);}
.rp-stepper span{font-size:13px;font-weight:700;color:var(--text);min-width:52px;text-align:center;}
.rp-arow{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-top:1px solid var(--line);cursor:pointer;}
.rp-arow .lab{font-size:13.5px;font-weight:600;color:var(--text);}
.rp-arow .val{font-size:12.5px;color:var(--text-sub);}
.rp-arow.open .val{color:var(--primary);}
.rp-panel{display:none;padding:2px 0 12px;}
.rp-panel.open{display:block;}

.emptytip{text-align:center;color:var(--text-sub);font-size:12.5px;padding:30px 10px;}
</style>
</head>

function arrayBufferToBase64(buf){
  let binary='';
  const bytes=new Uint8Array(buf);
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function base64ToArrayBuffer(b64){
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}

const REPEAT_WINDOW_DAYS=180;
function dowMonBased(d){ const j=d.getDay(); return j===0?6:j-1; }
function computeRepeatDates(repeat,fromExclusive,limit){
  const out=[];
  if(Array.isArray(repeat.days)&&repeat.days.length){
    let cur=addDays(fromExclusive,1);
    while(cur<=limit){
      if(repeat.days.includes(dowMonBased(cur))) out.push(new Date(cur));
      cur=addDays(cur,1);
    }
  }
  if(Array.isArray(repeat.monthDates)&&repeat.monthDates.length){
    let cur=new Date(fromExclusive.getFullYear(),fromExclusive.getMonth(),1);
    const limitMonth=new Date(limit.getFullYear(),limit.getMonth(),1);
    while(cur<=limitMonth){
      const y=cur.getFullYear(), m=cur.getMonth();
      const lastDay=new Date(y,m+1,0).getDate();
      repeat.monthDates.forEach(n=>{
        const day=Math.min(n,lastDay);
        const d=new Date(y,m,day);
        if(d>fromExclusive && d<=limit) out.push(d);
      });
      cur=new Date(y,m+1,1);
    }
  }
  if(repeat.yearly){
    const parts=repeat.yearly.split('-').map(Number);
    const mm=parts[0], dd=parts[1];
    if(mm&&dd){
      for(let y=fromExclusive.getFullYear();y<=limit.getFullYear()+1;y++){
        const d=new Date(y,mm-1,dd);
        if(d>fromExclusive && d<=limit) out.push(d);
      }
    }
  }
  return out;
}
function generateRepeatInstances(anchor){
  if(!anchor || !anchor.repeat || !anchor.date) return;
  const r=anchor.repeat;
  const hasPattern=(Array.isArray(r.days)&&r.days.length)||(Array.isArray(r.monthDates)&&r.monthDates.length)||r.yearly;
  if(!hasPattern) return;
  const untilStr=r.until;
  const startDate=parseYMD(anchor.date);
  const today=new Date(); today.setHours(0,0,0,0);
  const horizon=addDays(today,REPEAT_WINDOW_DAYS);
  const untilDate=untilStr?parseYMD(untilStr):null;
  const limit=(untilDate && untilDate<horizon)?untilDate:horizon;
  const existing=new Set(state.tasks.filter(t=>t.repeatParentId===anchor.id||t.id===anchor.id).map(t=>t.date));
  const anchorKids=childrenOf(anchor.id);
  computeRepeatDates(r,startDate,limit).forEach(d=>{
    const ds=dstr(d);
    if(existing.has(ds)) return;
    const newId=uid();
    state.tasks.push({
      id:newId,parentId:null,title:anchor.title,categoryId:anchor.categoryId,
      date:ds,startTime:anchor.startTime,duration:anchor.duration,
      completed:false,completedAt:null,order:state.tasks.length,
      repeat:null,repeatParentId:anchor.id,autoCarryOver:false,executionLogs:[],
      reminder:anchor.reminder
    });
    anchorKids.forEach(k=>{
      state.tasks.push({
        id:uid(),parentId:newId,title:k.title,categoryId:k.categoryId,
        date:ds,startTime:null,duration:k.duration||30,
        completed:false,completedAt:null,order:state.tasks.length,
        repeat:null,autoCarryOver:false,executionLogs:[]
      });
    });
    existing.add(ds);
  });
}
function repeatHasPattern(r){ return !!(r && ((Array.isArray(r.days)&&r.days.length)||(Array.isArray(r.monthDates)&&r.monthDates.length)||r.yearly)); }
function regenerateAllRepeats(){
  topTasks().filter(t=>!t.repeatParentId && repeatHasPattern(t.repeat)).forEach(generateRepeatInstances);
}
function repeatAnchorId(t){ return t.repeatParentId || t.id; }
function dedupeRepeatInstances(){
  const seen=new Map();
  const toRemove=new Set();
  topTasks().forEach(t=>{
    if(!isRepeatSeries(t)) return;
    const anchorId=repeatAnchorId(t);
    const key=t.date+'|'+anchorId;
    if(seen.has(key)){
      const keepId=seen.get(key);
      if(t.id===anchorId && keepId!==anchorId){
        toRemove.add(keepId);
        seen.set(key,t.id);
      } else {
        toRemove.add(t.id);
      }
    } else {
      seen.set(key,t.id);
    }
  });
  if(toRemove.size){
    state.tasks = state.tasks.filter(x=>!toRemove.has(x.id) && !toRemove.has(x.parentId));
  }
}
function repeatSeriesTasks(t){
  const anchorId=repeatAnchorId(t);
  return state.tasks.filter(x=>x.id===anchorId || x.repeatParentId===anchorId);
}
function isRepeatSeries(t){ return !!(t && (t.repeat || t.repeatParentId)); }
function regenerateSeriesForNewDays(anchor){
  const anchorId=anchor.id;
  const today=todayStr();
  state.tasks=state.tasks.filter(x=>!(x.repeatParentId===anchorId && x.date>=today && !x.completed));
  generateRepeatInstances(anchor);
}

/* ============== DAILY ============== */
function sleepStats(period){
  const anchorDate = state.ui.dailyDate?parseYMD(state.ui.dailyDate):new Date();
  const rows=[];
  for(let i=period-1;i>=0;i--){
    const d=addDays(anchorDate,-i);
    const ds=dstr(d);
    const log=state.sleep[ds];
    let dur=null;
    if(log && log.sleepAt && log.wakeAt){
      let diff=timeToMin(log.wakeAt)-timeToMin(log.sleepAt);
      if(diff<=0) diff+=24*60;
      dur=diff/60;
    }
    rows.push({d,ds,dur,sleepAt:log?log.sleepAt:null,wakeAt:log?log.wakeAt:null});
  }
  const withDur=rows.filter(r=>r.dur!==null);
  let avgDur=null,stdev=null,avgSleepStr=null,avgWakeStr=null;
  if(withDur.length){
    avgDur=withDur.reduce((s,r)=>s+r.dur,0)/withDur.length;
    const variance=withDur.reduce((s,r)=>s+Math.pow(r.dur-avgDur,2),0)/withDur.length;
    stdev=Math.sqrt(variance);
    const anchor=18*60;
    const sleepVals=withDur.map(r=>(timeToMin(r.sleepAt)-anchor+1440)%1440);
    const avgSleepVal=sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length;
    const avgSleepMin=Math.round((avgSleepVal+anchor)%1440);
    avgSleepStr=pad2(Math.floor(avgSleepMin/60))+':'+pad2(avgSleepMin%60);
    const wakeVals=withDur.map(r=>timeToMin(r.wakeAt));
    const avgWakeMin=Math.round(wakeVals.reduce((a,b)=>a+b,0)/wakeVals.length);
    avgWakeStr=pad2(Math.floor(avgWakeMin/60))+':'+pad2(avgWakeMin%60);
  }
  return {rows,withDur,avgDur,stdev,avgSleepStr,avgWakeStr};
}
function sleepInsight(s){
  if(!s.withDur.length) return '수면 기록을 남기면 여기에 분석이 표시돼요.';
  if(s.withDur.length<3) return '조금 더 기록이 쌓이면 리듬을 분석해줄게요.';
  const avg=s.avgDur, dev=s.stdev;
  if(dev<1 && avg>=7 && avg<=9) return `리듬이 꽤 <b>안정적</b>이야 — 이대로 가보자`;
  if(avg<6.5) return `요즘 수면 시간이 <b>부족</b>해요 — 조금 더 일찍 누워볼까요`;
  if(dev>=1.5) return `취침 시간이 <b>들쭉날쭉</b>해요 — 리듬을 맞춰봐요`;
  return `그럭저럭 <b>괜찮은</b> 흐름이에요`;
}
function renderSleepReportHTML(){
  const period=state.ui.sleepPeriod;
  const s=sleepStats(period);
  const tabs=[7,14,30];
  let chartHtml='';
  if(s.avgDur!==null){
    const W=290,H=70,pad=6;
    const maxD=Math.max(...s.withDur.map(r=>r.dur),9), minD=Math.min(...s.withDur.map(r=>r.dur),6);
    const range=Math.max(1,maxD-minD);
    const avgY=H-pad-((s.avgDur-minD)/range)*(H-2*pad);
    let pts='';
    if(s.rows.length>1){
      pts=s.rows.map((r,i)=>{
        const x=pad+(i/(s.rows.length-1))*(W-2*pad);
        if(r.dur===null)return null;
        const y=H-pad-((r.dur-minD)/range)*(H-2*pad);
        return `${x},${y}`;
      }).filter(Boolean).join(' ');
    }
    chartHtml=`<div class="sleeprpt-chartwrap">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
        <line x1="0" y1="${avgY}" x2="${W}" y2="${avgY}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3,3"/>
        ${pts?`<polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="1.6"/>`:''}
        <circle cx="${W-pad}" cy="${avgY}" r="2.5" fill="var(--primary)"/>
        <text x="${W-pad}" y="${avgY-6}" font-size="8" fill="var(--text-sub)" text-anchor="end">평균 ${avgDurLabel(s.avgDur)}</text>
      </svg>
      <div class="sleeprpt-xaxis">
        <span>${pad2(s.rows[0].d.getMonth()+1)}/${pad2(s.rows[0].d.getDate())}</span>
        <span>${pad2(s.rows[Math.floor(s.rows.length/2)].d.getMonth()+1)}/${pad2(s.rows[Math.floor(s.rows.length/2)].d.getDate())}</span>
        <span>${pad2(s.rows[s.rows.length-1].d.getMonth()+1)}/${pad2(s.rows[s.rows.length-1].d.getDate())}</span>
      </div>
    </div>`;
  }else{
    chartHtml=`<div class="sleeprpt-empty">아직 기록이 없어요</div>`;
  }
  return `<div class="sleeprpt">
    <div class="sleeprpt-h">🥱 수면 기록</div>
    <div class="sleeprpt-title">☾— sleep · ${period}일</div>
    <div class="sleeprpt-tabs">
      ${tabs.map(v=>`<button data-act="sleep-period" data-v="${v}" class="${period===v?'on':''}">${v===7?'지난 7일':v+'일'}</button>`).join('')}
      <button data-act="sleep-csv">⤓ CSV</button>
    </div>
    <div class="sleeprpt-insight">${sleepInsight(s)}</div>
    ${s.avgDur!==null?`<div class="sleeprpt-stats">
      <div><b>±${s.stdev.toFixed(1)}h</b><span>편차</span></div>
      <div><b>${avgDurLabel(s.avgDur)}</b><span>평균</span></div>
      <div><b>${s.avgSleepStr}</b><span>취침</span></div>
      <div><b>${s.avgWakeStr}</b><span>기상</span></div>
    </div>`:''}
    ${chartHtml}
  </div>`;
}
function avgDurLabel(h){
  const whole=Math.floor(h), frac=h-whole;
  return frac<0.25?`${whole}h`:(frac<0.75?`${whole}.5h`:`${whole+1}h`);
}
function downloadSleepCSV(){
  const period=state.ui.sleepPeriod;
  const s=sleepStats(period);
  let csv='날짜,취침,기상,수면시간(h)\n';
  s.rows.forEach(r=>{
    csv+=`${r.ds},${r.sleepAt||''},${r.wakeAt||''},${r.dur!==null?r.dur.toFixed(2):''}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`수면기록_${period}일.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function clipBlockTop(top,h){
  if(top<0){ h=h+top; top=0; }
  return [top,h];
}
function timetableHTML(ds,startH,endH,ROW,catFilter,opts){
  opts=opts||{};
  const isToday=ds===todayStr();
  let html='';
  html+=`<div class="timetable-wrap"><div style="position:relative;">`;
  for(let h=startH;h<endH;h++){
    html+=`<div class="hourline" style="height:${ROW}px"><span class="lbl">${pad2(h)}:00</span>${[10,20,30,40,50].map(m=>`<div class="${m===30?'halfline':'tenline'}" style="top:${ROW*m/60}px"></div>`).join('')}</div>`;
  }
  html+=`<div class="tt-body" id="ttbody" style="position:absolute;top:0;left:0;right:0;height:${(endH-startH)*ROW}px;">`;

  // 현재시간선
  if(isToday){
    const now=new Date();
    const nm=now.getHours()*60+now.getMinutes();
    if(nm>=startH*60 && nm<=endH*60){
      const top=(nm-startH*60)/60*ROW;
      html+=`<div class="nowline" style="top:${top}px"></div>`;
    }
  }

  // 스케줄된 일정
  let items=state.tasks.filter(t=>t.parentId===null && t.date===ds && t.startTime && catVisible(t.categoryId));
  if(catFilter!=='all') items=items.filter(t=>t.categoryId===catFilter);
  items.forEach(t=>{
    const sm=timeToMin(t.startTime);
    let top=(sm-startH*60)/60*ROW;
    let h=Math.max(26,(t.duration||30)/60*ROW - 2);
    [top,h]=clipBlockTop(top,h);
    if(h<=4) return;
    const c=cat(t.categoryId);
    html+=`<div class="evblock" style="top:${top}px;height:${h}px;background:${hexToRgba(c.color,0.16)};border-left-color:${c.color}" data-act="edit-task" data-id="${t.id}">
      <div class="t">${esc(t.title)}</div>
      <div class="meta"><span class="time" data-act="edit-time-inline" data-id="${t.id}">${t.startTime}</span>
        <span class="act" data-act="${t.completed?'uncomplete':'complete'}" data-id="${t.id}" onclick="event.stopPropagation()">${t.completed?'✓':'○'}</span>
      </div>
    </div>`;
  });
  // 작업(WORK) 연동 — 시간이 있는 작업을 같은 시간표에 표시
  if(opts.linkWork){
    state.work.tasks.filter(t=>t.date===ds&&t.startTime).forEach(t=>{
      const sm=timeToMin(t.startTime);
      let top=(sm-startH*60)/60*ROW;
      let h=Math.max(26,(t.duration||60)/60*ROW - 2);
      [top,h]=clipBlockTop(top,h);
      if(h<=4) return;
      const pj=wkProject(t.projectId)||wkDefaultProject();
      html+=`<div class="evblock" style="top:${top}px;height:${h}px;background:${hexToRgba(pj.color,0.16)};border-left-color:${pj.color}" data-act="work-edit" data-id="${t.id}">
        <div class="t">💼 ${esc(t.title)}</div>
        <div class="meta"><span class="time">${t.startTime}</span><span class="act" data-act="work-toggle" data-id="${t.id}">${t.done?'✓':'○'}</span></div>
      </div>`;
    });
  }
  // 실행기록 (진행중 포함)
  state.tasks.forEach(t=>{
    if(t.activeExecution && t.activeExecution.date===ds){
      const sm=timeToMin(t.activeExecution.start);
      const now=new Date();const nowm=now.getHours()*60+now.getMinutes();
      const em = isToday? nowm : sm+30;
      let top=(sm-startH*60)/60*ROW;
      let h=Math.max(24,(em-sm)/60*ROW);
      [top,h]=clipBlockTop(top,h);
      if(h<=4) return;
      const c=cat(t.categoryId);
      html+=`<div class="evblock" style="top:${top}px;height:${h}px;background:${hexToRgba(c.color,0.28)};border-left-color:${c.color};border-style:dashed">
        <div class="t">▶ ${esc(t.title)}</div>
        <div class="meta">실행중 · <span class="act" data-act="stopexec" data-id="${t.id}">■ 정지</span></div>
      </div>`;
    }
    t.executionLogs.forEach((l,idx)=>{
      if(l.date!==ds) return;
      const sm=timeToMin(l.start),em=timeToMin(l.end);
      let top=(sm-startH*60)/60*ROW;
      let h=Math.max(20,(em-sm)/60*ROW);
      [top,h]=clipBlockTop(top,h);
      if(h<=4) return;
      const c=cat(t.categoryId);
      html+=`<div class="evblock" style="top:${top}px;height:${h}px;background:${hexToRgba(c.color,0.10)};border-left-color:${c.color}" data-act="edit-execlog" data-id="${t.id}" data-idx="${idx}">
        <div class="t" style="font-size:11px">${esc(t.title)}</div>
        <div class="meta">${l.start}-${l.end}</div>
      </div>`;
    });
  });

  html+=`</div>`; // tt-body
  // 클릭 캡처 레이어 (빈 시간 터치)
  html+=`<div id="ttclick" style="position:absolute;top:0;left:44px;right:0;height:${(endH-startH)*ROW}px;"></div>`;
  html+=`</div></div>`;
  return html;
}
function bindTimetableClick(ds,startH,ROW){
  const c=document.getElementById('ttclick'); if(!c) return;
  c.addEventListener('click',e=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const y=e.clientY-rect.top;
    let mins=Math.round((y/ROW*60)/10)*10 + startH*60;
    openBlockModal({date:ds,startTime:minToTime(mins)});
  });

  }).join('');

  wrap.innerHTML=`
    <div class="wktt-head">
      <span class="x" data-act="tt-close">✕</span>
      <span class="title">주 시간표</span>

    <div class="wktt-body">

        <div class="wktt-lblcol" style="height:${(endH-startH)*ROW}px">${hourLabels}</div>
        <div class="wktt-cols">${colsHtml}</div>
      </div>
    </div>
  `;
}

/* ============== WEEK ============== */
function weekDates(){const s=state.ui.weekCursor;return [0,1,2,3,4,5,6].map(i=>addDays(s,i));}
function dayCompletion(dateStr){
  const items=topTasks().filter(t=>t.date===dateStr && !t.startTime && catVisible(t.categoryId));
  if(!items.length)return null;
  const done=items.filter(t=>isChecked(t)).length;
  return done/items.length;
}
/* 주간 탭에서 현재 선택된 날짜 (항상 하나로 확정: 선택값 > 오늘 > 주의 첫날) */
function weekSelDate(){
  const dates=weekDates().map(dstr);
  const sel=state.ui.weekSelectedDate;
  if(sel && dates.includes(sel)) return sel;
  const today=todayStr();
  return dates.includes(today)? today : dates[0];
}
function weekAddDate(){
  return weekSelDate();
}
function weekTasks(){
  const sel=weekSelDate();
  return topTasks()
    .filter(t=>t.date===sel && !t.startTime && catVisible(t.categoryId))
    .sort((a,b)=>a.order-b.order);
}
function plumSVG(pct,size,dim){
  const id='p'+uid();
  const gid='g'+uid();
  const topY=1.7, botY=19.5;
  const effPct=Math.max(pct,4);
  const fillY=botY-(botY-topY)*effPct/100;
  const blendTop=Math.max(topY,fillY-2.6);
  const blendPct=(v)=>Math.max(0,Math.min(100,((v-topY)/(botY-topY))*100));
  const peachPath="M10 5C8.5 2.8 6.2 1.7 4 2.5 1.5 3.4 0.3 6.3 1 9 2 13 5 18 10 19.5 15 18 18 13 19 9 19.7 6.3 18.5 3.4 16 2.5 13.8 1.7 11.5 2.8 10 5Z";
  return `<svg width="${size}" height="${size}" viewBox="0 0 20 22" style="opacity:${dim?0.4:1}">
    <defs>

      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--plum-skin-light)" stop-opacity="0"/>
        <stop offset="${blendPct(blendTop)}%" stop-color="var(--plum-skin-light)" stop-opacity="0"/>
        <stop offset="${blendPct(fillY)}%" stop-color="var(--plum-skin)" stop-opacity="1"/>

function fmtElapsed(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  return (h? h+':'+pad2(m) : pad2(m))+':'+pad2(sec);
}
/* ---------- 실행 중 작업 고정 바 ---------- */
function execStartMs(ex){
  if(ex.startedAt) return ex.startedAt;               // 이전 버전에서 시작한 기록은 날짜+시:분으로 계산
  const [y,m,d]=ex.date.split('-').map(Number), [hh,mm]=ex.start.split(':').map(Number);
  return new Date(y,m-1,d,hh,mm,0).getTime();
}
function renderExecBar(){
  const bar=document.getElementById('execbar'); if(!bar) return;
  const running=state.tasks.filter(t=>t.activeExecution)
    .sort((a,b)=>execStartMs(b.activeExecution)-execStartMs(a.activeExecution));
  document.body.classList.toggle('has-execbar',running.length>0);
  if(!running.length){ bar.hidden=true; bar.innerHTML=''; bar.dataset.key=''; return; }
  const t=running[0];
  const key=t.id+'|'+running.length+'|'+t.title;
  if(bar.dataset.key!==key){
    bar.innerHTML=`<span class="pulse"></span><span class="ttl">${t.activeExecution.targetMs?'🍅 ':''}${esc(t.title)}</span>`
      +(running.length>1?`<span class="more">+${running.length-1}</span>`:'')
      +`<span class="tm" id="execbarTime"></span><button class="stop" data-act="stopexec" data-id="${t.id}" aria-label="정지">${STOP_SVG}</button>`;
    bar.dataset.key=key;
  }
  bar.hidden=false;
  tickExecBar();
}
function tickExecBar(){
  const stop=document.querySelector('#execbar .stop'), tm=document.getElementById('execbarTime');
  if(!stop||!tm) return;
  const t=taskById(stop.dataset.id);
  if(!t||!t.activeExecution) return;
  const elapsed=Date.now()-execStartMs(t.activeExecution);
  if(t.activeExecution.targetMs){
    const remain=t.activeExecution.targetMs-elapsed;
    if(remain<=0){
      tm.textContent='0:00';
      try{ new Notification('🍅 집중 시간 끝!',{body:`"${t.title}" 타이머가 끝났어요.`,tag:'planner-timer-'+t.id}); }catch(e){}
      stopExec(t.id);
      return;
    }
    tm.textContent=fmtElapsed(remain)+' 남음';
  } else {
    tm.textContent=fmtElapsed(elapsed);
  }
}

function cancelWeekDraft(){ state.ui.weekDraft=null; render(); }
function commitWeekDraft(text){
  const d=state.ui.weekDraft;
  state.ui.weekDraft=null;
  const v=(text||'').trim();
  if(v){
    const act=weekTasks().filter(t=>!isChecked(t));
    const pos=d?Math.max(0,Math.min(d.pos,act.length)):act.length;
    const nt=addTopTask(v,{date:weekAddDate()});
    if(nt){
      // 눌러 둔 + 위치에 끼워 넣기 (맨 아래는 기본 순서 그대로)
      const prev=act[pos-1], next=act[pos];
      if(next) nt.order = prev ? (prev.order+next.order)/2 : next.order-1;
    }
  }
  render();
}
function renderWeekList(){
  const el=document.getElementById('weeklist');
  if(!el)return;
  const dayItems=weekTasks();
  const activeItems=dayItems.filter(t=>!isChecked(t));

  let html='';
  // 그 날 할 일이 아예 없을 때만 빈 안내 문구를 보여줌 (전부 완료한 경우는 완료 카드만)
  if(!dayItems.length && !draft){
    html+=`<div class="wk2-empty">이 날은 아직 비어 있어요. 할 일을 추가해보세요.</div>`;

  // 진행 중인 할 일이 있거나 입력 중일 때만 항목 사이 + 버튼 표시
  if(activeItems.length || draft){
    const draftPos=draft?Math.max(0,Math.min(draft.pos,activeItems.length)):-1;
    for(let g=0; g<=activeItems.length; g++){
      if(g>0) html+=renderWeekRow(activeItems[g-1]);
      html+=insertBtn(g);
      if(g===draftPos){ html+=renderWeekDraft(); html+=insertBtn(g); }

  }
  el.innerHTML=html;
  wireDragHandles(el,'.wk2-block','.wk2-handle');

  if(doneItems.length){

  if(state.work.cfg.linkWeekly){

      const sec=document.createElement('div');
      sec.className='wk2-worksec';

        const pj=wkProject(t.projectId)||wkDefaultProject();
        return `<div class="r ${t.done?'done':''}"><button class="c" data-act="work-toggle" data-id="${t.id}">${checkGlyphSVG(t.done,pj.color,18)}</button><span class="tt" data-act="work-edit" data-id="${t.id}">${t.startTime?`<small>${t.startTime}</small>`:''}${esc(t.title)}</span><span class="pn" style="color:${pj.color}">${esc(pj.name)}</span></div>`;
      }).join('');
      el.parentElement.appendChild(sec);
    }
  }

  const inp=document.getElementById('weekDraftInput');
  if(inp && draft){
    inp.value=draft.text||'';
    inp.addEventListener('input',()=>{ draft.text=inp.value; });
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'){ ev.preventDefault(); inp.dataset.done='1'; commitWeekDraft(inp.value); }
      else if(ev.key==='Escape'){ ev.preventDefault(); inp.dataset.done='1'; cancelWeekDraft(); }
    });
    inp.addEventListener('blur',()=>{
      // 칸이 닫히면서(취소/화면 전환) 생기는 blur는 무시 — 진짜로 포커스를 잃었을 때만 처리
      if(inp.dataset.done || state.ui.weekDraft!==draft) return;
      if(inp.value.trim()){ inp.dataset.done='1'; commitWeekDraft(inp.value); }
      else setTimeout(()=>{ if(document.body.contains(inp) && !inp.dataset.done && !inp.value.trim()){ inp.dataset.done='1'; cancelWeekDraft(); } },250);
    });
    inp.focus();
  }
}

let _dragState=null;
function wireDragHandles(container,blockSel,handleSel){
  container.querySelectorAll(handleSel).forEach(handle=>{
    handle.addEventListener('pointerdown',e=>{
      const block=handle.closest(blockSel);
      if(!block)return;
      e.preventDefault();
      _dragState={block,container,blockSel,prevTouchAction:document.body.style.touchAction};
      block.classList.add('dragging');
      document.body.style.touchAction='none';
      try{handle.setPointerCapture(e.pointerId);}catch(err){}
    });
  });
}
function _dragEnd(){
  if(!_dragState)return;
  const {block,container,blockSel,prevTouchAction}=_dragState;
  block.classList.remove('dragging');
  document.body.style.touchAction=prevTouchAction||'';
  const blocks=[...container.querySelectorAll(blockSel)];
  const ids=blocks.map(b=>b.dataset.id);
  const tasks=ids.map(id=>taskById(id)).filter(Boolean);
  const orders=tasks.map(t=>t.order).slice().sort((a,b)=>a-b);
  const today=todayStr();
  const total=tasks.length;
  tasks.forEach((t,i)=>{
    t.order=orders[i];
    if(isRepeatSeries(t)){
      // 오늘 목록에서 이 작업이 차지하는 상대적 위치(0~1)
      const frac= total>1 ? i/(total-1) : 0;
      const anchorId=repeatAnchorId(t);
      state.tasks.forEach(x=>{
        if((x.id===anchorId||x.repeatParentId===anchorId) && x.id!==t.id && x.date>=today){
          // 그 날짜에 실제로 존재하는 다른 작업들 구성에 맞춰 비례적으로 위치 산정
          const sibs=topTasks().filter(s=>s.date===x.date && s.id!==x.id).sort((a,b)=>a.order-b.order);
          if(!sibs.length) return;
          let idx=Math.round(frac*sibs.length);
          idx=Math.max(0,Math.min(sibs.length,idx));
          if(idx===0) x.order=sibs[0].order-1;
          else if(idx>=sibs.length) x.order=sibs[sibs.length-1].order+1;
          else x.order=(sibs[idx-1].order+sibs[idx].order)/2;
        }
      });
    }
  });
  _dragState=null;
  render();
}
document.addEventListener('pointermove',e=>{
  if(!_dragState)return;
  e.preventDefault();
  const {block,container,blockSel}=_dragState;
  const under=document.elementFromPoint(e.clientX,e.clientY);
  if(!under)return;
  const target=under.closest(blockSel);
  if(target && target!==block && container.contains(target)){
    const rect=target.getBoundingClientRect();
    const before=e.clientY < rect.top+rect.height/2;
    container.insertBefore(block, before?target:target.nextSibling);
  }
},{passive:false});
document.addEventListener('pointerup',_dragEnd);
document.addEventListener('pointercancel',_dragEnd);

function monthMatrix(){
  const cur=state.ui.monthCursor;
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const start=startOfWeek(first,state.settings.weekStartsMonday);
  const daysInMonth=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const offset=Math.round((first-start)/86400000);
  const weeks=Math.ceil((offset+daysInMonth)/7);
  const cells=[];
  for(let i=0;i<weeks*7;i++) cells.push(addDays(start,i));
  return cells;
}

function setupCalendarResize(){
  const puller=document.getElementById('calPuller');
  const calgrid=document.getElementById('calGrid');
  if(!puller||!calgrid) return;
  let startY=0,startZoom=state.settings.monthZoom||1,dragging=false;
  const clamp=v=>Math.max(0.75,Math.min(1.8,v));
  const onMove=(e)=>{
    if(!dragging) return;
    const y = e.touches? e.touches[0].clientY : e.clientY;
    calgrid.style.setProperty('--row-scale',clamp(startZoom+(y-startY)/160));
    if(e.cancelable) e.preventDefault();
  };
  const onUp=()=>{
    if(!dragging) return;
    dragging=false;
    state.settings.monthZoom=parseFloat(calgrid.style.getPropertyValue('--row-scale'))||startZoom;
    saveSettings();
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onUp);
    renderMonth();
  };
  const onDown=(e)=>{
    dragging=true;
    startY = e.touches? e.touches[0].clientY : e.clientY;
    startZoom = state.settings.monthZoom||1;
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('touchend',onUp);
    e.preventDefault();
  };
  puller.addEventListener('mousedown',onDown);
  puller.addEventListener('touchstart',onDown,{passive:false});
}
function dayExecLogs(ds){
  const logs=[];
  state.tasks.forEach(t=>{
    (t.executionLogs||[]).forEach((l,idx)=>{
      if(l.date===ds) logs.push({taskId:t.id,idx,start:l.start,end:l.end,title:t.title,categoryId:t.categoryId});

  logs.sort((a,b)=>a.start.localeCompare(b.start));
  return logs;
}

        state.settings.fontName=f.name;
        saveSettings();
        render();

    };
  } else if(t==='데이터'){
    document.getElementById('dataImport').onchange=(e)=>{
      const f=e.target.files[0]; if(!f)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const obj=JSON.parse(reader.result);
          if(obj.tasks) state.tasks=obj.tasks;
          if(obj.categories) state.categories=obj.categories;
          if(obj.settings) Object.assign(state.settings,obj.settings);
          if(obj.sleep) state.sleep=obj.sleep;
          if(obj.work && Array.isArray(obj.work.projects) && obj.work.projects.length) state.work=normalizeWork(obj.work);
          if(state.settings.tabVisible && state.settings.tabVisible.work===undefined) state.settings.tabVisible.work=true;
          render();
          notice('복원되었습니다.');
        }catch(err){notice('올바른 백업 파일이 아니에요.');}
      };
      reader.readAsText(f);
    };
  }
}

function parseQuickTask(raw){
  let text=raw.trim();
  let date=null, startTime=null, duration=null;
  const today=new Date();
  if(/오늘/.test(text)){ date=todayStr(); text=text.replace(/오늘/,''); }
  else if(/모레/.test(text)){ date=dstr(addDays(today,2)); text=text.replace(/모레/,''); }
  else if(/내일/.test(text)){ date=dstr(addDays(today,1)); text=text.replace(/내일/,''); }
  let m=text.match(/(\d{1,2})[./](\d{1,2})/);
  if(m && !date){ date=today.getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]); text=text.replace(m[0],''); }
  m=text.match(/(\d{1,2})월\s*(\d{1,2})일/);
  if(m && !date){ date=today.getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]); text=text.replace(m[0],''); }
  let ampm=0;
  if(/오후/.test(text)){ ampm=12; text=text.replace(/오후/,''); }
  if(/오전/.test(text)){ text=text.replace(/오전/,''); }
  m=text.match(/(\d{1,2})시\s*(\d{1,2})?분?/);
  if(m){
    let h=+m[1]; if(ampm && h<12) h+=12;
    const mi=m[2]?+m[2]:0;
    startTime=pad2(h)+':'+pad2(mi);
    text=text.replace(m[0],'');
  } else {
    m=text.match(/(\d{1,2}):(\d{2})/);
    if(m){ startTime=pad2(+m[1])+':'+m[2]; text=text.replace(m[0],''); }
  }
  m=text.match(/(\d+)\s*시간\s*(\d+)?\s*분?/);
  if(m){ duration=(+m[1])*60+(m[2]?+m[2]:0); text=text.replace(m[0],''); }
  else{
    m=text.match(/(\d+)\s*분/);
    if(m){ duration=+m[1]; text=text.replace(m[0],''); }
  }
  const title=text.replace(/\s+/g,' ').trim() || raw.trim();
  return {title, date:date||todayStr(), startTime, duration:duration||30};
}
